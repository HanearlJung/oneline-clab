<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>증권사 점유율 — 보호예수 · 담보대출</title>
<link rel="stylesheet" href="assets/base.css" />
<style>
  .hero{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;gap:20px}
  .hero h1{margin:0;font-size:24px;font-weight:850;letter-spacing:-.6px}
  .ctl{display:flex;gap:8px;align-items:center}
  .seg{display:flex;border:1px solid #d9dee7;border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;height:36px;padding:0 15px;font-size:12px;font-weight:750;color:#4b5563;cursor:pointer}
  .seg button.on{background:var(--primary);color:#fff}
  .chk{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border:1px solid #d9dee7;
    border-radius:9px;background:#fff;font-size:12px;font-weight:730;color:#4b5563;cursor:pointer}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .card{padding:22px 24px}
  .card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:4px}
  .card-t{font-size:17px;font-weight:800}
  .card-s{font-size:12px;color:var(--muted);margin-top:4px}
  .tot{display:flex;gap:20px;margin:14px 0 16px;padding:13px 16px;background:#f8fafc;border-radius:10px}
  .tot div{font-size:12px;color:var(--muted)}
  .tot b{display:block;font-size:19px;font-weight:850;color:var(--text);margin-top:3px;letter-spacing:-.4px}

  .row{display:grid;grid-template-columns:24px 1fr 118px 66px 62px;gap:11px;align-items:center;
    padding:9px 0;border-bottom:1px solid #f1f4f8}
  .row:last-of-type{border-bottom:0}
  .rk{color:var(--muted);font-size:11px;font-weight:800;text-align:right}
  .nm{font-weight:740;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm small{color:var(--muted);font-weight:600;margin-left:5px;font-size:10px}
  .bar{height:9px;border-radius:5px;background:#e8edf5;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px;background:var(--primary)}
  .pct{text-align:right;font-weight:850;font-variant-numeric:tabular-nums;font-size:14px}
  .cn{text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .row.me{background:#fff8ec;margin:0 -12px;padding:11px 12px;border-radius:9px;border-bottom:0}
  .row.me .bar i{background:var(--orange)}
  .row.me .nm,.row.me .pct{color:var(--orange)}
  .row.unk{border-top:2px solid var(--line);margin-top:8px;padding-top:12px;color:var(--muted)}
  .row.unk .nm{font-weight:700;color:var(--muted)}

  .basis{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);
    margin-top:16px;padding-top:14px;border-top:1px solid #f1f4f8}
  .basis b{color:var(--text)}
  .mock{font-size:10px;color:#9a6b00;background:#fff3d6;border-radius:4px;
    padding:2px 6px;margin-left:8px;font-weight:800;vertical-align:2px}

  /* ── 다크 테마 (임원 보고 화면 전용) ─────────────────────────── */
  body{
    background:
      radial-gradient(1100px 520px at 15% -12%, #1a1a1d 0%, transparent 62%),
      radial-gradient(900px 460px at 100% -6%, #161618 0%, transparent 58%),
      #0a0a0b;
    color:#f0f0f2;
  }
  .topbar{background:#08080a;border-bottom:1px solid #232326}
  .logo{background:linear-gradient(145deg,#3a3a3f,#232327);color:#e8e8ea;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
  .brand-title{color:#f4f4f6}
  .brand-sub{color:#7e7e88}
  .top-meta{color:#8a8a93}
  .nav a{color:#8a8a93}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:#2c2c31;color:#fff;box-shadow:inset 0 0 0 1px #3a3a40}

  .hero h1{color:#fafafa}
  .seg{background:#141416;border-color:#2b2b30}
  .seg button{background:transparent;color:#8f8f99}
  .seg button:hover{color:#e4e4e8}
  .seg button.on{background:#ececed;color:#111113}
  .chk{background:#141416;border-color:#2b2b30;color:#8f8f99}
  .chk input{accent-color:#c9a227}

  .panel{
    background:linear-gradient(180deg,#151517 0%,#111113 100%);
    border:1px solid #26262b;
    box-shadow:0 28px 70px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.035);
  }
  .card-t{color:#fafafa;letter-spacing:-.3px}
  .card-s{color:#83838d}

  .tot{background:#0e0e10;border:1px solid #232327}
  .tot div{color:#83838d}
  .tot b{color:#fafafa}

  .row{border-bottom:1px solid #1e1e22}
  .rk{color:#6a6a74}
  .nm{color:#e2e2e6}
  .nm small{color:#7b7b85}
  .bar{background:#212126}
  .bar i{background:linear-gradient(90deg,#6f6f7a,#c8c8cf)}
  .pct{color:#fafafa}
  .cn{color:#7b7b85}

  /* 자사 행은 금색으로. 무채색 막대 사이에서 확실히 도드라진다 */
  .row.me{background:rgba(201,162,39,.09);box-shadow:inset 0 0 0 1px rgba(201,162,39,.30)}
  .row.me .bar{background:#2a2418}
  .row.me .bar i{background:linear-gradient(90deg,#a8801c,#e8c86a);
    box-shadow:0 0 14px rgba(232,200,106,.35)}
  .row.me .nm,.row.me .pct{color:#e8c86a}
  .row.me .cn{color:#b39a5e}

  .row.gap{border-bottom:1px solid #1e1e22;opacity:.55}
  .row.gap .rk{letter-spacing:2px;color:#5e5e68}
  .row.gap .nm{color:#6a6a74;font-size:11px;font-weight:650}

  .row.unk{border-top:1px solid #2a2a2f;color:#6a6a74}
  .row.unk .nm{color:#6a6a74}
  .row.unk .bar{background:#1a1a1e}

  .badge{background:#1f1f24;color:#9a9aa4}
  .badge.blue{background:rgba(255,255,255,.07);color:#c6c6ce}
  .badge.orange{background:rgba(201,162,39,.14);color:#dcbc63}
  .basis{border-top:1px solid #1e1e22;color:#7b7b85}
  .basis b{color:#e2e2e6}
  .foot{color:#63636d}
  .empty{color:#7b7b85}

  @media(max-width:1100px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">O</div>
    <div><div class="brand-title">증권사 점유율</div>
      <div class="brand-sub">보호예수 수탁 · 주식담보대출</div></div></div>
  <nav class="nav">
    <a href="index.html">통합 조망</a>
    <a href="exec.html" class="on">증권사 점유율</a>
  </nav>
  <div class="top-meta" id="topMeta">불러오는 중…</div>
</header>

<main class="page">
  <div class="hero">
    <h1>보호예수 수탁 / 담보대출 M/S</h1>
    <div class="ctl">
      <div class="seg" id="modeSeg">
        <button data-m="cnt" class="on">건수 기준</button>
        <button data-m="amt">금액 기준</button>
      </div>
      <label class="chk"><input type="checkbox" id="estOn" checked /> 추정 포함</label>
    </div>
  </div>

  <div class="two">
    <section class="panel card">
      <div class="card-h">
        <div class="card-t">보호예수 수탁 M/S</div>
        <div class="badge blue" id="lkTag"></div>
      </div>
      <div class="tot" id="lkTot"></div>
      <div id="lkList"></div>
      <div class="basis" id="lkBasis"></div>
    </section>

    <section class="panel card">
      <div class="card-h">
        <div class="card-t">담보대출 M/S</div>
        <div class="badge orange" id="lnTag"></div>
      </div>
      <div class="tot" id="lnTot"></div>
      <div id="lnList"></div>
      <div class="basis" id="lnBasis"></div>
    </section>
  </div>

  <div class="foot" id="foot"></div>
</main>

<script>
const el = id => document.getElementById(id);
const eok = v => { if (v == null) return null; const a = v / 1e8;
  if (a >= 10000) { const j = a / 10000; return (Number.isInteger(j) ? j.toFixed(0) : j.toFixed(1)) + "조"; }
  return Math.round(a).toLocaleString("ko-KR") + "억"; };
const fd = s => s ? s.replaceAll("-", ".") : "";
const ME = "삼성증권";
let D = null, mode = "cnt", est = true;

function list(rows, unknown, keyCnt, keyPct, keyAmt, keyAmtPct, nameKey, showEst) {
  const pctKey = mode === "cnt" ? keyPct : keyAmtPct;
  const top = rows.slice(0, 10);
  const mi = rows.findIndex(r => r[nameKey] === ME);
  // 상위 10위 밖의 자사 행을 끌어올릴 때, 사이가 비었다는 걸 표시해야 한다
  const items = top.map(r => ({ t: "r", r }));
  if (mi >= 10) {
    items.push({ t: "gap", n: mi - 10 });
    items.push({ t: "r", r: rows[mi] });
  }
  const max = Math.max(...top.map(r => r[pctKey]), 1);
  const body = items.map(it => {
    if (it.t === "gap") return `<div class="row gap">
      <div class="rk">⋯</div><div class="nm">${it.n}개 기관 생략</div>
      <div></div><div></div><div></div></div>`;
    const r = it.r, rank = rows.indexOf(r) + 1, me = r[nameKey] === ME;
    const estN = showEst && r.est_cnt ? `<small>추정 ${r.est_cnt}</small>` : "";
    return `<div class="row ${me ? "me" : ""}">
      <div class="rk">${rank}</div>
      <div class="nm">${r[nameKey]}${estN}</div>
      <div class="bar"><i style="width:${(r[pctKey] / max * 100).toFixed(1)}%"></i></div>
      <div class="pct">${r[pctKey].toFixed(1)}%</div>
      <div class="cn">${mode === "cnt" ? r[keyCnt] + "건" : eok(r[keyAmt])}</div>
    </div>`;
  }).join("");
  const u = unknown.cnt ? `<div class="row unk">
      <div class="rk">—</div><div class="nm">기관 미상</div>
      <div class="bar"></div><div class="pct">—</div>
      <div class="cn">${unknown.cnt}건</div></div>` : "";
  return body + u;
}

function render() {
  const lkSrc = est ? D.ms_lockup : D.ms_lockup_strict;
  const lk = lkSrc, ln = D.ms_loan;

  if (lk) {
    el("lkTag").textContent = `${lk.rows.length}개사`;
    el("lkTot").innerHTML =
      `<div>집계 건수<b>${lk.total.cnt.toLocaleString("ko-KR")}건</b></div>
       <div>평가금액<b>${eok(lk.total.amt)}원</b></div>
       <div>해제 예정<b>${D.kpi.lockup.active_cnt}건</b></div>`;
    el("lkList").innerHTML = list(lk.rows, lk.unknown, "cnt", "cnt_ms", "amt", "amt_ms", "broker", true);
    const b = D.lockup_basis;
    el("lkBasis").innerHTML =
      `<div>수탁 근거 — 공시 기재 <b>${b.기재}건</b> · 주관사 추정 <b>${b.추정}건</b> · 미상 <b>${b.미상}건</b></div>
       <div>${est ? "추정 포함 집계" : "공시 기재분만 집계"}</div>`;
  } else {
    el("lkList").innerHTML = '<div class="empty">보호예수 데이터가 없습니다.</div>';
  }

  el("lnTag").textContent = `${ln.rows.length}개사`;
  el("lnTot").innerHTML =
    `<div>집계 건수<b>${ln.total.cnt.toLocaleString("ko-KR")}건</b></div>
     <div>대출 잔액<b>${eok(ln.total.balance)}원</b></div>
     <div>담보 평가액<b>${eok(ln.total.collateral)}원</b></div>`;
  el("lnList").innerHTML = list(ln.rows, ln.unknown, "cnt", "cnt_ms", "balance", "balance_ms", "lender", false);
  el("lnBasis").innerHTML =
    `<div>기관 미상 <b>${ln.unknown.cnt}건</b> — 분모 제외</div>
     <div>복수기관 계약 <b>${ln.multi_lender_cnt}건</b> — 균등 분할</div>`;

}

async function init() {
  try {
    const r = await fetch("data/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error("dashboard.json " + r.status);
    D = await r.json();
  } catch (e) {
    el("topMeta").textContent = "데이터 로드 실패";
    el("lkList").innerHTML = `<div class="empty">데이터를 불러오지 못했습니다. (${e.message})</div>`;
    return;
  }
  el("topMeta").innerHTML = `기준일 ${fd(D.meta.baseDate)}`;
  el("foot").textContent = `출처 ${D.meta.source} · 생성 ${D.meta.generated}`;

  document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  el("estOn").onchange = e => { est = e.target.checked; render(); };
  render();
}
init();
</script>
</body>
</html>
