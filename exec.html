<script>
const el = id => document.getElementById(id);
// 이름을 굵게 쓰는 곳은 삼성증권뿐이다. 나머지는 보통 굵기로 둔다.
const isKey = n => n === "삼성증권";
const eok = v => { if (v == null) return null; const a = v / 1e8;
  if (a >= 10000) { const j = a / 10000; return (Number.isInteger(j) ? j.toFixed(0) : j.toFixed(1)) + "조"; }
  if (a < 1) return Math.round(v / 1e4).toLocaleString("ko-KR") + "만";      // 1억 미만은 만원 단위로
  return Math.round(a).toLocaleString("ko-KR") + "억"; };
const fd = s => s ? s.replaceAll("-", ".") : "";
const ME = "삼성증권";
// 처음 열었을 때: 금액 기준 · 가장 최근 연도 · 스팩·리츠 제외
let D = null, mode = "amt", est = true, year = "all", scope = "core";

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function list(rows0, unknown, keyCnt, keyPct, keyAmt, keyAmtPct, nameKey, showEst) {
  const kindOf = nameKey === "broker" ? "lockup" : "loan";
  const unit = nameKey === "broker" ? "개사" : "건";     // 보호예수는 IPO 1건 = 회사 1곳
  const pctKey = mode === "cnt" ? keyPct : keyAmtPct;
  // 순위는 보고 있는 기준(건수·금액)으로 매긴다
  const rows = [...rows0].filter(r => mode !== "cnt" || r[keyCnt] > 0)
    .sort((a, b) => b[pctKey] - a[pctKey] || b[keyCnt] - a[keyCnt]);
  const top = rows.slice(0, 10);
  const mi = rows.findIndex(r => r[nameKey] === ME);
  // 상위 10위 밖의 자사 행을 끌어올릴 때, 사이가 비었다는 걸 표시해야 한다
  const items = top.map(r => ({ t: "r", r }));
  if (mi >= 10) {
    items.push({ t: "gap", n: mi - 10 });
    items.push({ t: "r", r: rows[mi] });
  }
  const max = Math.max(...top.map(r => r[pctKey]), 1);
  const body = items.map(it => {
    if (it.t === "gap") return `<div class="row gap">
      <div class="rk">⋯</div><div class="nm">${it.n}개 기관 생략</div>
      <div></div><div></div><div></div></div>`;
    const r = it.r, rank = rows.indexOf(r) + 1, me = r[nameKey] === ME;
    const estN = "";
    return `<div class="row ${me ? "me" : ""}" style="cursor:pointer" title="이 기관의 건 보기"
      data-org="${esc(r[nameKey])}" data-kind="${kindOf}">
      <div class="rk">${rank}</div>
      <div class="nm">${esc(r[nameKey])}${estN}</div>
      <div class="bar"><i style="width:${(r[pctKey] / max * 100).toFixed(1)}%"></i></div>
      <div class="pct">${r[pctKey].toFixed(1)}%</div>
      <div class="cn">${mode === "cnt" ? r[keyCnt].toLocaleString("ko-KR") + unit : eok(r[keyAmt])}</div>
    </div>`;
  }).join("");
  return body;
}

/* ── 증권사를 누르면 그 기관의 건을 팝업으로 ─────────────────────── */
const won = v => v == null ? '<span style="color:#5d6a85">—</span>' : eok(v) + "원";
const dartUrl = no => "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=" + no;
const kindTag = d => d.spac ? '<span class="tag sp">스팩</span>' : d.reit ? '<span class="tag rt">리츠</span>'
  : d.m === "KOSPI" ? '<span class="tag kp">코스피</span>' : '<span class="tag kq">코스닥</span>';

function openIpoList(org) {
  const inScope = d => (scope === "all" || (!d.spac && !d.reit)) && (year === "all" || d.d.slice(0, 4) === year);
  const rows = (D.ipo_deals || []).filter(inScope).map(d => {
    const a = d.al.find(x => x[0] === org), lead = d.lead.includes(org);
    if (!a && !lead) return null;
    const qty = d.amt && d.px ? d.amt / d.px : null;
    return { d, lead, amt: a ? a[1] : null, qty: a && qty ? Math.round(qty * a[2]) : null };
  }).filter(Boolean);
  const nLead = rows.filter(x => x.lead).length, sum = rows.reduce((s, x) => s + (x.amt || 0), 0);

    <div>대표주관 <b>${nLead}건</b></div>${rows.length > nLead ? `<div>인수 참여 <b>${rows.length - nLead}건</b></div>` : ""}
    <div>수탁금액 합계 <b>${eok(sum)}원</b></div>`;
  el("mlH").innerHTML = `<tr><th>회사명</th><th>상장일</th><th>구분</th><th class="r">수탁금액</th><th class="r">수량</th><th>수탁 증권사</th><th>원문</th></tr>`;
  el("mlB").innerHTML = rows.length ? rows.map(({ d, lead, amt, qty }) => `<tr>

/* 담보대출은 계약 단위로 공시된다. 한 회사에 차주가 여럿이고 한 사람이 여러 번 빌리므로
   그대로 나열하면 같은 회사가 수십 줄 이어진다. 회사 1곳을 한 줄로 묶고, 누르면 계약을 펼친다. */
let loanGroups = [], loanOpen = new Set(), loanOrg = "", lnYear = "all";
function openLoanList(org) {
  const base = D.meta.baseDate, m = new Map();
  D.loans.filter(x => (x.lenders || []).includes(org) && (!x.maturity_date || x.maturity_date >= base)
      && (lnYear === "all" || (x.contract_date || "").slice(0, 4) === lnYear))
    .forEach(x => { if (!m.has(x.stock_code)) m.set(x.stock_code, []); m.get(x.stock_code).push(x); });
  loanGroups = [...m.values()].map(items => {
    items.sort((a, b) => (a.maturity_date || "9999").localeCompare(b.maturity_date || "9999"));
    const who = [...new Set(items.map(x => x.borrower_name).filter(Boolean))];
    return { items, code: items[0].stock_code, name: items[0].corp_name, market: items[0].market, who,
      amt: items.reduce((s, x) => s + (x.amount_counted || 0) / Math.max(1, (x.lenders || []).length), 0),
      qty: items.reduce((s, x) => s + (x.pledged_qty || 0), 0),
      next: (items.find(x => x.maturity_date) || {}).maturity_date || null,
      noDate: items.filter(x => !x.maturity_date).length };
  }).sort((a, b) => (a.next || "9999").localeCompare(b.next || "9999") || b.amt - a.amt);
  loanOpen = new Set(); loanOrg = org;
  const n = loanGroups.reduce((s, g) => s + g.items.length, 0), sum = loanGroups.reduce((s, g) => s + g.amt, 0);
  el("mlT").textContent = `${org} · 주식담보대출${lnYear === "all" ? "" : ` · ${lnYear}년 체결`}`;
  el("mlSum").innerHTML = `<div>만기가 지나지 않은 계약</div><div>기업 <b>${loanGroups.length.toLocaleString("ko-KR")}개사</b></div>
    <div>계약 <b>${n.toLocaleString("ko-KR")}건</b></div><div>대출 잔액 <b>${eok(sum)}원</b></div>
    <div>기업을 누르면 계약이 펼쳐집니다</div>`;
  el("mlH").innerHTML = `<tr><th>회사명</th><th>구분</th><th>차주</th><th class="r">계약</th><th class="r">대출금액</th>
    <th class="r">담보 수량</th><th>다음 만기</th></tr>`;
  drawLoanList();
  el("modalList").classList.add("on");
  el("modalList").querySelector(".lwrap").scrollTop = 0;
}

      <td><div class="nm2${isKey(g.name) ? " key" : ""}"><span class="car2">▶</span>${esc(g.name)}</div><div class="sub2" style="margin-left:16px">${g.code || ""}</div></td>

      <td style="white-space:nowrap">${g.next ? fd(g.next) : dim("미상")}${g.noDate && g.next ? ` <span class="sub2" style="display:inline">미상 ${g.noDate}건</span>` : ""}</td>
    </tr>` + (on ? `<tr class="ls"><td colspan="7"><table class="lt2"><thead><tr><th>차주</th><th>관계</th><th class="r">대출금액</th>
        <th class="r">담보 수량</th><th>체결일</th><th>만기</th><th>대출기관</th><th>원문</th></tr></thead><tbody>${
        g.items.map(x => `<tr><td>${esc(x.borrower_name || "미상")}</td><td>${esc(x.borrower_type || "")}</td>
          <td class="r">${x.loan_amount ? eok(x.loan_amount) + "원" : dim("미상")}${x.shared_cnt ? ` <span class="sub2" style="display:inline" title="한 대출에 담보가 여러 건 묶여 있습니다. 합계에는 한 번만 셉니다.">공동${x.shared_cnt}</span>` : ""}</td>
          <td class="r">${x.pledged_qty ? x.pledged_qty.toLocaleString("ko-KR") + "주" : dim("—")}</td>
          <td style="white-space:nowrap">${x.contract_date ? fd(x.contract_date) : dim("미상")}</td>
          <td style="white-space:nowrap">${x.maturity_date ? fd(x.maturity_date) : dim(esc((x.period_raw || "미상").slice(0, 14)))}</td>
          <td>${(x.lenders || []).map(b => b === loanOrg ? `<span class="me2">${esc(b)}</span>` : esc(b)).join(" · ")}</td>
          <td><a class="o" href="${x.source_url}" target="_blank" rel="noopener">원문</a></td></tr>`).join("")
        }</tbody></table></td></tr>` : "");
  }).join("") : `<tr><td colspan="7" style="text-align:center;color:#7f8da8;padding:30px">해당하는 건이 없습니다.</td></tr>`;

    <th class="r">${loan ? "계약" : "주관 기업"}</th><th class="r">건수 점유율</th>

      <td class="r">${n(r.cnt)}${unit}</td><td class="r">${(r.cnt_ms || 0).toFixed(1)}%</td>
      <td class="r">${r[aKey] ? eok(r[aKey]) + "원" : '<span style="color:#5d6a85">—</span>'}</td><td class="r">${(r[apKey] || 0).toFixed(1)}%</td></tr>`).join("");
  el("modalList").classList.add("on");

       <div>건수 — IPO 대표주관회사 기준 · 공동대표주관 <b>${(lk.joint_cnt || 0).toLocaleString("ko-KR")}개사</b>는 각 주관사에 1건</div>

     <div>담보 평가액<b>${eok(ln.total.collateral)}원</b></div>`;
  el("lnList").innerHTML = list(ln.rows, ln.unknown, "cnt", "cnt_ms", "balance", "balance_ms", "lender", false);

     <div>수집 — 대량보유상황보고서 · 거래소 담보제공계약 공시 · 회사·제출인별 <b>최신 공시</b> 기준</div>
     <div>금액 — 공시에 적힌 <b>대출금액</b> (담보계약 추가 기재사항 표)</div>`;

}

/* ── 삼성증권 연도별 순위 3D 그래프 ───────────────────────────────
   막대 높이는 순위다 (1위가 가장 높다). 비스듬히 본 직육면체를 SVG 로 그린다.
   x: 연도, y: 순위, z: 깊이.  화면 좌표 = (x + z·0.62, −y − z·0.36)            */
const G3 = { W: 1000, H: 330, L: 86, B: 268, plotW: 760, plotH: 196, dz: 46, bw: 78, MAXR: 10 };
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, text) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
const P3 = (x, y, z) => [G3.L + x + z * 0.62, G3.B - y - z * 0.36];
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

function rankSeries(key) {
  const src = (D.ms_ipo || {})[scope] || {};
  return Object.keys(src).filter(y => y !== "all").sort().map(y => {
    const rows = src[y].rows.filter(r => key === "amt" ? r.amt > 0 : r.cnt > 0)
      .sort((a, b) => key === "amt" ? b.amt - a.amt : (b.cnt - a.cnt || b.amt - a.amt));
    const i = rows.findIndex(r => r.broker === ME);
    const r = rows[i];
    return { year: y, rank: i < 0 ? null : i + 1, of: rows.length,
      val: !r ? "주관 없음" : key === "amt" ? eok(r.amt) + "원" : r.cnt + "건",
      ms: !r ? "" : (key === "amt" ? r.amt_ms : r.cnt_ms).toFixed(1) + "%" };
  });
}

function draw3d(svg, series, uid) {
  svg.innerHTML = "";
  const maxR = Math.max(G3.MAXR, ...series.map(s => s.rank || 0));
  const hOf = r => r == null ? 0 : G3.plotH * (maxR - r + 1) / maxR;
  const defs = sv("defs", {});
  defs.innerHTML = `
    <linearGradient id="f${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc95a"/><stop offset="1" stop-color="#d9861a"/></linearGradient>
    <linearGradient id="s${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9741a"/><stop offset="1" stop-color="#7d4a0c"/></linearGradient>
    <linearGradient id="t${uid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe09a"/><stop offset="1" stop-color="#ffc95a"/></linearGradient>
    <filter id="g${uid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>`;
  svg.appendChild(defs);

  // 바닥과 뒷벽
  svg.appendChild(sv("polygon", { points: pts([P3(0, 0, 0), P3(G3.plotW, 0, 0), P3(G3.plotW, 0, G3.dz * 2.1), P3(0, 0, G3.dz * 2.1)]),
    fill: "rgba(132,150,240,.06)", stroke: "#22304d", "stroke-width": 1 }));
  svg.appendChild(sv("polygon", { points: pts([P3(0, 0, G3.dz * 2.1), P3(G3.plotW, 0, G3.dz * 2.1), P3(G3.plotW, G3.plotH, G3.dz * 2.1), P3(0, G3.plotH, G3.dz * 2.1)]),
    fill: "rgba(255,255,255,.018)", stroke: "#1c2740", "stroke-width": 1 }));
  [1, 3, 5, 7, 10].filter(r => r <= maxR).forEach(r => {
    const y = hOf(r), a = P3(0, y, G3.dz * 2.1), b = P3(G3.plotW, y, G3.dz * 2.1), c = P3(0, y, 0);
    svg.appendChild(sv("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: r === 1 ? "rgba(245,178,60,.45)" : "#22304d",
      "stroke-width": 1, "stroke-dasharray": r === 1 ? "" : "3 5" }));
    svg.appendChild(sv("line", { x1: c[0], y1: c[1], x2: a[0], y2: a[1], stroke: "#22304d", "stroke-width": 1 }));
    svg.appendChild(sv("text", { x: c[0] - 10, y: c[1] + 4, "text-anchor": "end", "font-size": 13, "font-weight": 700,
      fill: r === 1 ? "#f5b23c" : "#7f8da8" }, r + "위"));
  });

  const step = G3.plotW / series.length, z0 = G3.dz * 0.55, z1 = z0 + G3.dz;
  const bars = series.map((s, i) => {
    const x0 = i * step + (step - G3.bw) / 2, x1 = x0 + G3.bw, g = sv("g", {});
    const glow = sv("ellipse", { cx: P3((x0 + x1) / 2, 0, (z0 + z1) / 2)[0], cy: P3(0, 0, (z0 + z1) / 2)[1] + 4, rx: G3.bw * 0.78, ry: 13,
      fill: "rgba(245,178,60,.35)", filter: `url(#g${uid})`, opacity: 0 });
    const side = sv("polygon", { fill: `url(#s${uid})` }), front = sv("polygon", { fill: `url(#f${uid})` }),
      top = sv("polygon", { fill: `url(#t${uid})` }), edge = sv("polyline", { fill: "none", stroke: "rgba(255,240,200,.55)", "stroke-width": 1 });
    const cx = P3((x0 + x1) / 2, 0, z0)[0] + 14;
    const lab = sv("g", { opacity: 0 });
    const tRank = sv("text", { x: cx, "text-anchor": "middle", "font-size": 27, "font-weight": 850, fill: "#ffd27a",
      style: "paint-order:stroke;stroke:#0d1424;stroke-width:5px" }, s.rank ? s.rank + "위" : "—");
    const tVal = sv("text", { x: cx, "text-anchor": "middle", "font-size": 13.5, "font-weight": 700, fill: "#c9d4ea",
      style: "paint-order:stroke;stroke:#0d1424;stroke-width:4px" }, s.rank ? `${s.val} · ${s.ms}` : s.val);
    lab.appendChild(tRank); lab.appendChild(tVal);
    const yr = P3((x0 + x1) / 2, 0, 0);
    svg.appendChild(sv("text", { x: yr[0] - 6, y: yr[1] + 30, "text-anchor": "middle", "font-size": 16, "font-weight": 800, fill: "#dbe4f5" }, s.year + "년"));
    [glow, side, front, top, edge, lab].forEach(n => g.appendChild(n));
    svg.appendChild(g);
    const target = hOf(s.rank);
    const set = k => {                       // k: 0 → 1
      const h = Math.max(target * k, 0.01);
      front.setAttribute("points", pts([P3(x0, 0, z0), P3(x1, 0, z0), P3(x1, h, z0), P3(x0, h, z0)]));
      side.setAttribute("points", pts([P3(x1, 0, z0), P3(x1, 0, z1), P3(x1, h, z1), P3(x1, h, z0)]));
      top.setAttribute("points", pts([P3(x0, h, z0), P3(x1, h, z0), P3(x1, h, z1), P3(x0, h, z1)]));
      edge.setAttribute("points", pts([P3(x0, h, z0), P3(x1, h, z0), P3(x1, h, z1)]));
      glow.setAttribute("opacity", (0.9 * k).toFixed(2));
      const ty = P3(0, h, z1)[1];
      tRank.setAttribute("y", ty - 26); tVal.setAttribute("y", ty - 8);
      lab.setAttribute("opacity", Math.max(0, (k - 0.72) / 0.28).toFixed(2));
    };
    set(0);
    return set;
  });
  return bars;
}

/* 담보대출 — 상위 10개 기관과 삼성증권. 막대 높이는 값(건수·금액)이다. */
function lenderSeries(key) {
  const ms = (D.ms_loan_by_year || {})[lnYear] || D.ms_loan;
  const v = r => key === "amt" ? r.balance : r.cnt, pct = r => key === "amt" ? r.balance_ms : r.cnt_ms;
  const rows = ms.rows.filter(r => v(r) > 0).sort((a, b) => v(b) - v(a) || b.balance - a.balance);
  const mi = rows.findIndex(r => r.lender === ME);
  const pick = rows.slice(0, 10).map((r, i) => [r, i + 1]);
  if (mi >= 10) pick.push([rows[mi], mi + 1]);
  const max = Math.max(...pick.map(([r]) => v(r)), 1);
  return { max, key, gap: mi >= 10, bars: pick.map(([r, rank]) => ({
    name: r.lender, rank, me: r.lender === ME, k: v(r) / max,
    val: key === "amt" ? eok(r.balance) : r.cnt.toLocaleString("ko-KR") + "건", ms: pct(r).toFixed(1) + "%" })) };
}
function drawBars3d(svg, S, uid) {
  svg.innerHTML = "";
  const W = 850, H = G3.plotH, L = 74, dz = G3.dz;
  const Q = (x, y, z) => [L + x + z * 0.62, G3.B - y - z * 0.36];
  const defs = sv("defs", {});
  defs.innerHTML = `
    <linearGradient id="f${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc95a"/><stop offset="1" stop-color="#d9861a"/></linearGradient>
    <linearGradient id="s${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9741a"/><stop offset="1" stop-color="#7d4a0c"/></linearGradient>
    <linearGradient id="t${uid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe09a"/><stop offset="1" stop-color="#ffc95a"/></linearGradient>
    <linearGradient id="fb${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9df2"/><stop offset="1" stop-color="#4455a3"/></linearGradient>
    <linearGradient id="sb${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d4d96"/><stop offset="1" stop-color="#262f66"/></linearGradient>
    <linearGradient id="tb${uid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9c4fa"/><stop offset="1" stop-color="#95a5f5"/></linearGradient>
    <filter id="g${uid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>`;
  svg.appendChild(defs);
  svg.appendChild(sv("polygon", { points: pts([Q(0, 0, 0), Q(W, 0, 0), Q(W, 0, dz * 2.1), Q(0, 0, dz * 2.1)]),
    fill: "rgba(132,150,240,.06)", stroke: "#22304d", "stroke-width": 1 }));
  svg.appendChild(sv("polygon", { points: pts([Q(0, 0, dz * 2.1), Q(W, 0, dz * 2.1), Q(W, H, dz * 2.1), Q(0, H, dz * 2.1)]),
    fill: "rgba(255,255,255,.018)", stroke: "#1c2740", "stroke-width": 1 }));
  const HMAX = H * 0.8;                       // 가장 큰 막대 위에 값 글자가 들어갈 자리를 남긴다
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const y = HMAX * f, a = Q(0, y, dz * 2.1), b = Q(W, y, dz * 2.1), c = Q(0, y, 0);
    svg.appendChild(sv("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#22304d", "stroke-width": 1, "stroke-dasharray": "3 5" }));
    svg.appendChild(sv("line", { x1: c[0], y1: c[1], x2: a[0], y2: a[1], stroke: "#22304d", "stroke-width": 1 }));
    svg.appendChild(sv("text", { x: c[0] - 8, y: c[1] + 4, "text-anchor": "end", "font-size": 11.5, "font-weight": 700, fill: "#7f8da8" },
      S.key === "amt" ? eok(S.max * f) : Math.round(S.max * f).toLocaleString("ko-KR") + "건"));
  });
  const n = S.bars.length, step = W / n, bw = Math.min(50, step * 0.62), z0 = dz * 0.55, z1 = z0 + dz;
  return S.bars.map((s, i) => {
    const x0 = i * step + (step - bw) / 2, x1 = x0 + bw, g = sv("g", {}), c = s.me ? "" : "b";
    const glow = sv("ellipse", { cx: Q((x0 + x1) / 2, 0, (z0 + z1) / 2)[0], cy: Q(0, 0, (z0 + z1) / 2)[1] + 4, rx: bw * 0.8, ry: 12,
      fill: s.me ? "rgba(245,178,60,.4)" : "rgba(132,150,240,.22)", filter: `url(#g${uid})`, opacity: 0 });
    const side = sv("polygon", { fill: `url(#s${c}${uid})` }), front = sv("polygon", { fill: `url(#f${c}${uid})` }),
      top = sv("polygon", { fill: `url(#t${c}${uid})` }),
      edge = sv("polyline", { fill: "none", stroke: s.me ? "rgba(255,240,200,.6)" : "rgba(200,220,255,.4)", "stroke-width": 1 });
    const cx = Q((x0 + x1) / 2, 0, z0)[0] + 14, lab = sv("g", { opacity: 0 });
    const tVal = sv("text", { x: cx, "text-anchor": "middle", "font-size": s.me ? 17 : 13.5, "font-weight": 850,
      fill: s.me ? "#ffd27a" : "#e6edfb", style: "paint-order:stroke;stroke:#0d1424;stroke-width:4px" }, s.val);
    const tPct = sv("text", { x: cx, "text-anchor": "middle", "font-size": 11.5, "font-weight": 700,
      fill: s.me ? "#f0b45c" : "#9aa7bd", style: "paint-order:stroke;stroke:#0d1424;stroke-width:4px" }, s.ms);
    lab.appendChild(tVal); lab.appendChild(tPct);
    const base = Q((x0 + x1) / 2, 0, 0);
    if (s.me && S.gap) svg.appendChild(sv("text", { x: Q(i * step, 0, 0)[0] - 4, y: base[1] + 24, "text-anchor": "middle",
      "font-size": 15, "font-weight": 800, fill: "#5d6a85" }, "⋯"));
    svg.appendChild(sv("text", { x: base[0] - 4, y: base[1] + 22, "text-anchor": "middle", "font-size": s.me ? 15 : 13,
      "font-weight": 850, fill: s.me ? "#f5b23c" : "#8fa0bf" }, s.rank + "위"));
    svg.appendChild(sv("text", { x: base[0] - 4, y: base[1] + 40, "text-anchor": "middle", "font-size": 11.5,
      "font-weight": s.me ? 800 : 500, fill: s.me ? "#ffd27a" : "#c9d4ea" }, s.name.length > 7 ? s.name.slice(0, 6) + "…" : s.name));
    [glow, side, front, top, edge, lab].forEach(e => g.appendChild(e));
    svg.appendChild(g);
    const target = Math.max(HMAX * s.k, 3);
    const set = k => {
      const h = Math.max(target * k, 0.01);
      front.setAttribute("points", pts([Q(x0, 0, z0), Q(x1, 0, z0), Q(x1, h, z0), Q(x0, h, z0)]));
      side.setAttribute("points", pts([Q(x1, 0, z0), Q(x1, 0, z1), Q(x1, h, z1), Q(x1, h, z0)]));
      top.setAttribute("points", pts([Q(x0, h, z0), Q(x1, h, z0), Q(x1, h, z1), Q(x0, h, z1)]));
      edge.setAttribute("points", pts([Q(x0, h, z0), Q(x1, h, z0), Q(x1, h, z1)]));
      glow.setAttribute("opacity", (0.9 * k).toFixed(2));
      const ty = Q(0, h, z1)[1];
      tVal.setAttribute("y", ty - 20); tPct.setAttribute("y", ty - 6);
      lab.setAttribute("opacity", Math.max(0, (k - 0.72) / 0.28).toFixed(2));
    };
    set(0);
    return set;
  });
}

let raf3 = 0, g3Kind = "ipo";
function play3d() {
  cancelAnimationFrame(raf3);
  const loan = g3Kind === "loan", gapMs = loan ? 140 : 230;
  const a = loan ? drawBars3d(el("g3cnt"), lenderSeries("cnt"), "c") : draw3d(el("g3cnt"), rankSeries("cnt"), "c"),
    b = loan ? drawBars3d(el("g3amt"), lenderSeries("amt"), "a") : draw3d(el("g3amt"), rankSeries("amt"), "a");
  // 위 그래프가 왼쪽부터 차례로, 이어서 아래 그래프가 차례로 솟는다
  const items = [...a.map((f, i) => [f, i * gapMs]), ...b.map((f, i) => [f, a.length * gapMs + 260 + i * gapMs])];
  const DUR = 820, ease = t => 1 - Math.pow(1 - t, 3);   // 끝에서 감속
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { items.forEach(([f]) => f(1)); return; }
  const t0 = performance.now();
  const tick = now => {
    let live = false;
    items.forEach(([f, d]) => { const t = Math.min(1, Math.max(0, (now - t0 - d) / DUR));
      f(Math.min(1, Math.max(0, ease(t)))); if (t < 1) live = true; });
    if (live) raf3 = requestAnimationFrame(tick);
  };
  raf3 = requestAnimationFrame(tick);
}
function open3dLoan() {
  g3Kind = "loan";
  const ms = (D.ms_loan_by_year || {})[lnYear] || D.ms_loan;
  el("m3t").textContent = `삼성증권 담보대출 순위 · ${lnYear === "all" ? "현재 잔액 전체" : lnYear + "년 체결"}`;
  el("m3sub").textContent = `${lnYear === "all" ? "현재 남아 있는 계약 전체" : `현재 남아 있는 계약 중 ${lnYear}년에 체결하거나 연장한 계약`} · ${ms.rows.length}개 기관 중 상위 10곳과 삼성증권 · 막대가 높을수록 규모가 큽니다`;
  el("g3tCnt").innerHTML = "건수 기준 <small>담보대출 계약 건수</small>";
  el("g3tAmt").innerHTML = "금액 기준 <small>대출금액</small>";
  el("modal3d").classList.add("on");
  play3d();
}
function open3d() {
  g3Kind = "ipo";
  el("m3t").textContent = "삼성증권 연도별 IPO 주관 순위";
  el("g3tCnt").innerHTML = "건수 기준 <small>대표주관 기업 수 순위</small>";
  el("g3tAmt").innerHTML = "금액 기준 <small>실제 인수금액 순위</small>";
  const src = (D.ms_ipo || {})[scope] || {}, ys = Object.keys(src).filter(y => y !== "all").sort();
  el("m3sub").textContent = `${ys[0]}년 ~ ${ys[ys.length - 1]}년 상장 · ${scope === "all" ? "스팩·리츠 포함" : "스팩·리츠·인프라펀드 제외"} · 막대가 높을수록 순위가 높습니다`;
  el("modal3d").classList.add("on");
  play3d();
}
function close3d() { el("modal3d").classList.remove("on"); cancelAnimationFrame(raf3); }

async function init() {
  try {
    const r = await fetch("data/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error("dashboard.json " + r.status);
    D = await r.json();
  } catch (e) {
    el("topMeta").textContent = "데이터 로드 실패";
    el("lkList").innerHTML = `<div class="empty">데이터를 불러오지 못했습니다. (${e.message})</div>`;
    return;
  }
  const U = D.meta.universe, C = D.meta.collection || {};
  const ymd = s => s.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
  el("topMeta").innerHTML = `<div>기준일 ${fd(D.meta.baseDate)}</div><div>상장사 ${U.listed.toLocaleString("ko-KR")}개사</div>`;
  el("foot").innerHTML = `출처 ${D.meta.source} · 생성 ${D.meta.generated}<br>`
    + `대상 KOSPI ${U.kospi.toLocaleString("ko-KR")} · KOSDAQ ${U.kosdaq.toLocaleString("ko-KR")}개사<br>`
    + (C.majorstock ? `담보대출 — ${ymd(C.majorstock.period[0])} ~ ${ymd(C.majorstock.period[1])} 접수 대량보유상황보고서(제출인별 최신)·거래소 담보제공 공시<br>` : "")
    + `보호예수 수탁 M/S — 한국거래소(KIND) 신규상장기업현황 ${fd(D.meta.ipoRange[0])} ~ ${fd(D.meta.ipoRange[1])} 코스피·코스닥, IPO 대표주관회사(증권신고서) 기준`;

  document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  el("estOn").onchange = e => { est = e.target.checked; render(); };
  document.addEventListener("click", e => {
    const r = e.target.closest(".row[data-org]");
    if (r) (r.dataset.kind === "lockup" ? openIpoList : openLoanList)(r.dataset.org);
  });
  el("mlB").addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const k = e.target.closest("tr.rkr");
    if (k) { (k.dataset.kind === "loan" ? openLoanList : openIpoList)(k.dataset.org); return; }
    const r = e.target.closest("tr.lg");
    if (!r) return;
    loanOpen.has(r.dataset.c) ? loanOpen.delete(r.dataset.c) : loanOpen.add(r.dataset.c);
    drawLoanList();
  });
  el("mlClose").onclick = closeList;
  el("modalList").onclick = e => { if (e.target.id === "modalList") closeList(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeList(); });
  el("btn3d").onclick = open3d;
  el("btn3dLn").onclick = open3dLoan;
  el("btnAllLn").onclick = () => openRankList("loan");
  el("btnAllLk").onclick = () => openRankList("lockup");
  el("m3close").onclick = close3d;
  el("m3replay").onclick = play3d;
  el("modal3d").onclick = e => { if (e.target.id === "modal3d") close3d(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") close3d(); });
  const lys0 = Object.keys(D.ms_loan_by_year || {}).filter(k => k !== "all").sort();
  if (lys0.length) lnYear = lys0[lys0.length - 1];        // 기본값: 가장 최근 체결 연도
  const view = new URLSearchParams(location.search).get("view");
  if (view === "samsung3d") open3d();
  if (view === "samsung3d-loan") open3dLoan();
  const ys = Object.keys((D.ms_ipo || {}).core || D.ms_lockup_by_year || {}).filter(k => k !== "all").sort();
  if (ys.length) year = ys[ys.length - 1];
  el("yearSeg").innerHTML = [["all", "전체"], ...ys.map(y => [y, y + "년"])].map(([k, t]) =>
    `<button data-y="${k}" class="${k === year ? "on" : ""}">${t}</button>`).join("");
  const lys = Object.keys(D.ms_loan_by_year || {}).filter(k => k !== "all").sort();
  el("lnYearSeg").innerHTML = [["all", "전체"], ...lys.map(y => [y, y + "년 체결"])].map(([k, t]) =>
    `<button data-y="${k}" class="${k === lnYear ? "on" : ""}">${t}</button>`).join("");
  document.querySelectorAll("#lnYearSeg button").forEach(b => b.onclick = () => {
    lnYear = b.dataset.y;
    document.querySelectorAll("#lnYearSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelectorAll("#scopeSeg button").forEach(b => b.onclick = () => {
    scope = b.dataset.s;
    document.querySelectorAll("#scopeSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelectorAll("#yearSeg button").forEach(b => b.onclick = () => {
    year = b.dataset.y;
    document.querySelectorAll("#yearSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  render();
}
init();
</script>
