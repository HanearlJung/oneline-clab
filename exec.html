<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>증권사 점유율 — 보호예수 · 담보대출</title>
<link rel="stylesheet" href="assets/base.css" />
<style>
  .hero{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;gap:20px}
  .hero h1{margin:0;font-size:30px;font-weight:850;letter-spacing:-.6px}
  .ctl{display:flex;gap:8px;align-items:center}
  .seg{display:flex;border:1px solid #d9dee7;border-radius:9px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;height:42px;padding:0 20px;font-size:15px;font-weight:750;color:#4b5563;cursor:pointer}
  .seg button.on{background:var(--primary);color:#fff}
  .chk{display:flex;align-items:center;gap:9px;height:42px;padding:0 17px;border:1px solid #d9dee7;
    border-radius:9px;background:#fff;font-size:15px;font-weight:730;color:#4b5563;cursor:pointer}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .card{padding:26px 28px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-bottom:14px;border-bottom:1px solid var(--line)}
  .card-t{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.3px}
  .card-t::before{content:"";width:4px;height:21px;border-radius:2px;background:var(--acc)}
  .card-s{font-size:14px;color:var(--muted);margin-top:5px}
  .tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin:16px 0 18px}
  .tot div{padding:12px 14px;border-radius:11px;background:#f8fafc;border:1px solid var(--line);
    font-size:14px;color:var(--muted)}
  .tot b{display:block;font-size:25px;font-weight:850;color:var(--text);margin-top:6px;
    letter-spacing:-.5px;font-variant-numeric:tabular-nums}

  .row{display:grid;grid-template-columns:30px 1fr 150px 84px 74px;gap:14px;align-items:center;
    padding:13px 0;border-bottom:1px solid #f1f4f8}
  .row:last-of-type{border-bottom:0}
  .rk{color:var(--muted);font-size:14px;font-weight:800;text-align:right}
  .nm{font-weight:750;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nm small{color:var(--muted);font-weight:600;margin-left:7px;font-size:13px}
  .bar{height:12px;border-radius:6px;background:#e8edf5;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:6px;background:var(--primary)}
  .pct{text-align:right;font-weight:850;font-variant-numeric:tabular-nums;font-size:19px}
  .cn{text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .row.me{background:#fff8ec;margin:0 -14px;padding:15px 14px;border-radius:10px;border-bottom:0}
  .row.me .bar i{background:var(--orange)}
  .row.me .nm,.row.me .pct{color:var(--orange)}
  .row.unk{border-top:2px solid var(--line);margin-top:8px;padding-top:12px;color:var(--muted)}
  .row.unk .nm{font-weight:700;color:var(--muted)}

  .basis{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--muted);
    margin-top:18px;padding-top:16px;border-top:1px solid #f1f4f8}
  .basis b{color:var(--text)}
  .mock{font-size:10px;color:#9a6b00;background:#fff3d6;border-radius:4px;
    padding:2px 6px;margin-left:8px;font-weight:800;vertical-align:2px}

  /* ── 다크 테마 (임원 보고 화면 전용) ─────────────────────────── */
  body{
    background:
      radial-gradient(1200px 600px at 12% -10%, #16233c 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #131d34 0%, transparent 55%),
      #090e19;
    color:#e6ecf7;
  }
  .topbar{background:#060b14;border-bottom:1px solid #1a2438}
  .brand-sub{color:#7d8ba4}
  .top-meta{color:#8b98b0}
  .nav a{color:#8b98b0}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:#3b6cf0;color:#fff}

  .hero h1{color:#f2f6ff}
  .seg{background:#111a2c;border-color:#25314a}
  .seg button{background:transparent;color:#9aa7bd}
  .seg button:hover{color:#dbe4f5}
  .seg button.on{background:#3b6cf0;color:#fff}
  .chk{background:#111a2c;border-color:#25314a;color:#9aa7bd}
  .chk input{accent-color:#3b6cf0}

  .panel{
    background:linear-gradient(180deg,#141d31 0%,#111927 100%);
    border:1px solid #222d45;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .card{--acc:#63a0ff}
  .card.ln{--acc:#f5b23c}
  .card-h{border-bottom-color:#1e2941}
  .card-t{color:#f2f6ff}
  .card-t::before{box-shadow:0 0 12px var(--acc)}
  .card-s{color:#8291ab}

  .tot div{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border-color:rgba(255,255,255,.08);color:#94a3ba}
  .tot b{color:#dfe7f5}
  .card.lk .tot div:first-child{background:linear-gradient(180deg,rgba(59,108,240,.20),rgba(59,108,240,.06));
    border-color:rgba(99,160,255,.32)}
  .card.ln .tot div:first-child{background:linear-gradient(180deg,rgba(245,178,60,.18),rgba(245,178,60,.05));
    border-color:rgba(245,178,60,.32)}
  .tot div:first-child{color:#b9c6dc}
  .tot div:first-child b{color:var(--acc);font-size:28px}

  .row{border-bottom:1px solid #1b2439}
  .rk{color:#6c7b96}
  .nm{color:#dde5f4}
  .nm small{color:#7385a1}
  .bar{background:#1a2540}
  .bar i{background:linear-gradient(90deg,#3b6cf0,#63a0ff);box-shadow:0 0 14px rgba(80,140,255,.45)}
  .pct{color:#f2f6ff}
  .cn{color:#7d8ca6}

  .row.me{background:rgba(245,178,60,.10);box-shadow:inset 0 0 0 1px rgba(245,178,60,.28)}
  .row.me .bar i{background:linear-gradient(90deg,#e08c1e,#f5b23c);box-shadow:0 0 16px rgba(245,178,60,.55)}
  .row.me .nm,.row.me .pct{color:#f5b23c}
  .row.me .cn{color:#c79a55}

  .row.gap{border-bottom:1px solid #1b2439;opacity:.6}
  .row.gap .rk{letter-spacing:2px;color:#5f6e88}
  .row.gap .nm{color:#6c7b96;font-size:13px;font-weight:650}

  .row.unk{border-top:1px solid #232f49;color:#6c7b96}
  .row.unk .nm{color:#6c7b96}
  .row.unk .bar{background:#151e33}

  .badge{background:#1a2440;color:#9aa7bd}
  .badge.blue{background:rgba(59,108,240,.18);color:#7fa8ff}
  .badge.orange{background:rgba(245,178,60,.16);color:#f0b45c}
  .basis{border-top:1px solid #1b2439;color:#7d8ca6}
  .basis b{color:#dde5f4}
  .foot{color:#66748e}
  .empty{color:#7d8ca6}

  @media(max-width:1100px){.two{grid-template-columns:1fr}}

  /* ── 삼성증권 연도별 순위 (3D) ─────────────────────────────── */
  .btn3d{height:44px;padding:0 18px;border-radius:9px;border:1px solid rgba(245,178,60,.55);
    background:linear-gradient(180deg,rgba(245,178,60,.20),rgba(245,178,60,.08));color:#f5b23c;
    font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap;
    box-shadow:0 0 18px rgba(245,178,60,.18)}
  .btn3d:hover{background:linear-gradient(180deg,rgba(245,178,60,.32),rgba(245,178,60,.14));color:#ffd27a}
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(4,8,16,.72);backdrop-filter:blur(3px);padding:24px}
  .modal.on{display:flex}
  .modal-box{width:min(1080px,100%);max-height:calc(100vh - 48px);overflow:auto;border-radius:18px;
    background:linear-gradient(180deg,#131c30,#0d1424);border:1px solid #26334f;
    box-shadow:0 30px 80px rgba(0,0,0,.6);padding:24px 28px 22px}
  .modal-h{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
  .modal-t{font-size:22px;font-weight:850;letter-spacing:-.4px;color:#f5b23c}
  .modal-s{font-size:13.5px;color:#8f9db6;margin-bottom:10px}
  .modal-x{display:flex;gap:8px}
  .modal-x button{height:36px;padding:0 14px;border-radius:8px;border:1px solid #2a3753;background:#111a2c;
    color:#c6d1e6;font-size:14px;font-weight:700;cursor:pointer}
  .modal-x button:hover{color:#fff;border-color:#3b4c72}
  .g3{margin-top:10px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid #1e2942;padding:14px 16px 6px}
  .g3-t{display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:800;color:#e6ecf7}
  .g3-t small{font-size:13px;font-weight:600;color:#8f9db6}
  .g3 svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">O</div>
    <div><div class="brand-title">증권사 점유율</div>
      <div class="brand-sub">보호예수 수탁 · 주식담보대출</div></div></div>
  <nav class="nav">
    <a href="index.html">통합 조망</a>
    <a href="exec.html" class="on">증권사 점유율</a>
  </nav>
  <div class="top-meta" id="topMeta">불러오는 중…</div>
</header>

<main class="page">
  <div class="hero">
    <h1>보호예수 수탁 / 담보대출 M/S</h1>
    <div class="ctl">
      <div class="seg" id="modeSeg">
        <button data-m="cnt">건수 기준</button>
        <button data-m="amt" class="on">금액 기준</button>
      </div>
      <label class="chk"><input type="checkbox" id="estOn" checked /> 추정 포함</label>
    </div>
  </div>

  <div class="two">
    <section class="panel card lk">
      <div class="card-h">
        <div class="card-t">보호예수 수탁 M/S</div>
        <div class="badge blue" id="lkTag"></div>
      </div>
      <div class="tot" id="lkTot"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px">
        <div class="seg" id="yearSeg" style="flex-wrap:wrap"></div>
        <button class="btn3d" id="btn3d" title="연도별 삼성증권 순위를 3D 그래프로 봅니다">삼성증권(3D)</button>
        <div class="seg" id="scopeSeg">
          <button data-s="core" class="on" title="증권업계 리그테이블의 통상 기준">스팩·리츠 제외</button>
          <button data-s="all">전체 포함</button>
        </div>
      </div>
      <div id="lkList"></div>
      <div class="basis" id="lkBasis"></div>
    </section>

    <section class="panel card ln">
      <div class="card-h">
        <div class="card-t">담보대출 M/S</div>
        <div class="badge orange" id="lnTag"></div>
      </div>
      <div class="tot" id="lnTot"></div>
      <div id="lnList"></div>
      <div class="basis" id="lnBasis"></div>
    </section>
  </div>

  <div class="foot" id="foot"></div>
</main>

<div class="modal" id="modal3d" role="dialog" aria-modal="true" aria-labelledby="m3t">
  <div class="modal-box">
    <div class="modal-h">
      <div class="modal-t" id="m3t">삼성증권 연도별 IPO 주관 순위</div>
      <div class="modal-x">
        <button id="m3replay">다시 보기</button>
        <button id="m3close">닫기 ✕</button>
      </div>
    </div>
    <div class="modal-s" id="m3sub"></div>
    <div class="g3"><div class="g3-t">건수 기준 <small>대표주관 기업 수 순위</small></div><svg id="g3cnt" viewBox="0 0 1000 330"></svg></div>
    <div class="g3"><div class="g3-t">금액 기준 <small>실제 인수금액 순위</small></div><svg id="g3amt" viewBox="0 0 1000 330"></svg></div>
  </div>
</div>

<script>
const el = id => document.getElementById(id);
const eok = v => { if (v == null) return null; const a = v / 1e8;
  if (a >= 10000) { const j = a / 10000; return (Number.isInteger(j) ? j.toFixed(0) : j.toFixed(1)) + "조"; }
  return Math.round(a).toLocaleString("ko-KR") + "억"; };
const fd = s => s ? s.replaceAll("-", ".") : "";
const ME = "삼성증권";
// 처음 열었을 때: 금액 기준 · 가장 최근 연도 · 스팩·리츠 제외
let D = null, mode = "amt", est = true, year = "all", scope = "core";

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function list(rows0, unknown, keyCnt, keyPct, keyAmt, keyAmtPct, nameKey, showEst) {
  const kindOf = nameKey === "broker" ? "lockup" : "loan";
  const unit = nameKey === "broker" ? "개사" : "건";     // 보호예수는 IPO 1건 = 회사 1곳
  const pctKey = mode === "cnt" ? keyPct : keyAmtPct;
  // 순위는 보고 있는 기준(건수·금액)으로 매긴다
  const rows = [...rows0].filter(r => mode !== "cnt" || r[keyCnt] > 0)
    .sort((a, b) => b[pctKey] - a[pctKey] || b[keyCnt] - a[keyCnt]);
  const top = rows.slice(0, 10);
  const mi = rows.findIndex(r => r[nameKey] === ME);
  // 상위 10위 밖의 자사 행을 끌어올릴 때, 사이가 비었다는 걸 표시해야 한다
  const items = top.map(r => ({ t: "r", r }));
  if (mi >= 10) {
    items.push({ t: "gap", n: mi - 10 });
    items.push({ t: "r", r: rows[mi] });
  }
  const max = Math.max(...top.map(r => r[pctKey]), 1);
  const body = items.map(it => {
    if (it.t === "gap") return `<div class="row gap">
      <div class="rk">⋯</div><div class="nm">${it.n}개 기관 생략</div>
      <div></div><div></div><div></div></div>`;
    const r = it.r, rank = rows.indexOf(r) + 1, me = r[nameKey] === ME;
    const estN = "";
    return `<div class="row ${me ? "me" : ""}" style="cursor:pointer" title="이 기관의 건만 보기"
      onclick="location.href='index.html?kind=${kindOf}&org=${encodeURIComponent(r[nameKey])}${kindOf === "lockup" ? "&when=all" + (year !== "all" ? "&year=" + year : "") : ""}'">
      <div class="rk">${rank}</div>
      <div class="nm">${esc(r[nameKey])}${estN}</div>
      <div class="bar"><i style="width:${(r[pctKey] / max * 100).toFixed(1)}%"></i></div>
      <div class="pct">${r[pctKey].toFixed(1)}%</div>
      <div class="cn">${mode === "cnt" ? r[keyCnt].toLocaleString("ko-KR") + unit : eok(r[keyAmt])}</div>
    </div>`;
  }).join("");
  const u = unknown.cnt ? `<div class="row unk">
      <div class="rk">—</div><div class="nm">기관 미상</div>
      <div class="bar"></div><div class="pct">—</div>
      <div class="cn">${mode === "cnt" ? unknown.cnt.toLocaleString("ko-KR") + unit : eok(unknown.amt ?? unknown.balance)}</div></div>` : "";
  return body + u;
}

function render() {
  // 수탁 증권사 = IPO 대표주관회사. 추정·기재 구분이 없으므로 토글은 쓰지 않는다.
  el("estOn").parentElement.style.display = "none";
  const lk = ((D.ms_ipo || {})[scope] || D.ms_lockup_by_year || {})[year] || D.ms_lockup, ln = D.ms_loan;
  const yl = year === "all" ? `${D.meta.ipoRange[0].slice(0, 4)}년 ~ 현재 상장` : `${year}년 상장`;

  if (lk) {
    el("lkTag").textContent = `${yl} · ${lk.rows.length}개 증권사`;
    el("lkTot").innerHTML =
      `<div>IPO 기업<b>${lk.total.companies.toLocaleString("ko-KR")}개사</b></div>
       <div>공모금액<b>${eok(lk.total.amt)}원</b></div>
       <div>코스피 · 코스닥<b>${lk.total.kospi} · ${lk.total.kosdaq}</b></div>`;
    el("lkList").innerHTML = list(lk.rows, lk.unknown, "cnt", "cnt_ms", "amt", "amt_ms", "broker", true);
    el("lkBasis").innerHTML =
      `<div>한국거래소 신규상장 목록 기준 · ${yl} <b>${lk.total.companies.toLocaleString("ko-KR")}개사</b>${
        scope === "all" ? ` (스팩 ${lk.total.spac} · 리츠 등 ${lk.total.reit} 포함)` : " (스팩·리츠·인프라펀드 제외)"} · 회사 1곳 = 1건</div>
       <div>건수 — IPO 대표주관회사 기준 · 공동대표주관 <b>${(lk.joint_cnt || 0).toLocaleString("ko-KR")}개사</b>는 각 주관사에 1건</div>
       <div>금액 — 증권사별 <b>실제 인수금액</b> (증권신고서 인수인 표의 비율 × 확정 공모금액)</div>`;
  } else {
    el("lkList").innerHTML = '<div class="empty">보호예수 데이터가 없습니다.</div>';
  }

  el("lnTag").textContent = `${ln.rows.length.toLocaleString("ko-KR")}개 기관`;
  el("lnTot").innerHTML =
    `<div>집계 건수<b>${ln.total.cnt.toLocaleString("ko-KR")}건</b></div>
     <div>대출 잔액<b>${eok(ln.total.balance)}원</b></div>
     <div>담보 평가액<b>${eok(ln.total.collateral)}원</b></div>`;
  el("lnList").innerHTML = list(ln.rows, ln.unknown, "cnt", "cnt_ms", "balance", "balance_ms", "lender", false);
  el("lnBasis").innerHTML =
    `<div>기관 미상 <b>${ln.unknown.cnt}건</b> — 분모 제외</div>
     <div>복수기관 계약 <b>${ln.multi_lender_cnt}건</b> — 균등 분할</div>
     <div>대상 기업 <b>${D.kpi.loan.total_co.toLocaleString("ko-KR")}개사</b> · 만기가 지난 계약 제외 · 대출금액 미공시 건은 금액에서 제외</div>
     <div>공동담보 대출은 금액을 한 번만 집계 · 담보 평가액의 3배를 넘는 복합여신 <b>${(D.kpi.loan.facility_cnt || 0).toLocaleString("ko-KR")}건</b>은 금액에서 제외</div>`;

}

/* ── 삼성증권 연도별 순위 3D 그래프 ───────────────────────────────
   막대 높이는 순위다 (1위가 가장 높다). 비스듬히 본 직육면체를 SVG 로 그린다.
   x: 연도, y: 순위, z: 깊이.  화면 좌표 = (x + z·0.62, −y − z·0.36)            */
const G3 = { W: 1000, H: 330, L: 86, B: 268, plotW: 760, plotH: 196, dz: 46, bw: 78, MAXR: 10 };
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, text) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
const P3 = (x, y, z) => [G3.L + x + z * 0.62, G3.B - y - z * 0.36];
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

function rankSeries(key) {
  const src = (D.ms_ipo || {})[scope] || {};
  return Object.keys(src).filter(y => y !== "all").sort().map(y => {
    const rows = src[y].rows.filter(r => key === "amt" ? r.amt > 0 : r.cnt > 0)
      .sort((a, b) => key === "amt" ? b.amt - a.amt : (b.cnt - a.cnt || b.amt - a.amt));
    const i = rows.findIndex(r => r.broker === ME);
    const r = rows[i];
    return { year: y, rank: i < 0 ? null : i + 1, of: rows.length,
      val: !r ? "주관 없음" : key === "amt" ? eok(r.amt) + "원" : r.cnt + "건",
      ms: !r ? "" : (key === "amt" ? r.amt_ms : r.cnt_ms).toFixed(1) + "%" };
  });
}

function draw3d(svg, series, uid) {
  svg.innerHTML = "";
  const maxR = Math.max(G3.MAXR, ...series.map(s => s.rank || 0));
  const hOf = r => r == null ? 0 : G3.plotH * (maxR - r + 1) / maxR;
  const defs = sv("defs", {});
  defs.innerHTML = `
    <linearGradient id="f${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc95a"/><stop offset="1" stop-color="#d9861a"/></linearGradient>
    <linearGradient id="s${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9741a"/><stop offset="1" stop-color="#7d4a0c"/></linearGradient>
    <linearGradient id="t${uid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe09a"/><stop offset="1" stop-color="#ffc95a"/></linearGradient>
    <filter id="g${uid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>`;
  svg.appendChild(defs);

  // 바닥과 뒷벽
  svg.appendChild(sv("polygon", { points: pts([P3(0, 0, 0), P3(G3.plotW, 0, 0), P3(G3.plotW, 0, G3.dz * 2.1), P3(0, 0, G3.dz * 2.1)]),
    fill: "rgba(99,160,255,.06)", stroke: "#22304d", "stroke-width": 1 }));
  svg.appendChild(sv("polygon", { points: pts([P3(0, 0, G3.dz * 2.1), P3(G3.plotW, 0, G3.dz * 2.1), P3(G3.plotW, G3.plotH, G3.dz * 2.1), P3(0, G3.plotH, G3.dz * 2.1)]),
    fill: "rgba(255,255,255,.018)", stroke: "#1c2740", "stroke-width": 1 }));
  [1, 3, 5, 7, 10].filter(r => r <= maxR).forEach(r => {
    const y = hOf(r), a = P3(0, y, G3.dz * 2.1), b = P3(G3.plotW, y, G3.dz * 2.1), c = P3(0, y, 0);
    svg.appendChild(sv("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: r === 1 ? "rgba(245,178,60,.45)" : "#22304d",
      "stroke-width": 1, "stroke-dasharray": r === 1 ? "" : "3 5" }));
    svg.appendChild(sv("line", { x1: c[0], y1: c[1], x2: a[0], y2: a[1], stroke: "#22304d", "stroke-width": 1 }));
    svg.appendChild(sv("text", { x: c[0] - 10, y: c[1] + 4, "text-anchor": "end", "font-size": 13, "font-weight": 700,
      fill: r === 1 ? "#f5b23c" : "#7f8da8" }, r + "위"));
  });

  const step = G3.plotW / series.length, z0 = G3.dz * 0.55, z1 = z0 + G3.dz;
  const bars = series.map((s, i) => {
    const x0 = i * step + (step - G3.bw) / 2, x1 = x0 + G3.bw, g = sv("g", {});
    const glow = sv("ellipse", { cx: P3((x0 + x1) / 2, 0, (z0 + z1) / 2)[0], cy: P3(0, 0, (z0 + z1) / 2)[1] + 4, rx: G3.bw * 0.78, ry: 13,
      fill: "rgba(245,178,60,.35)", filter: `url(#g${uid})`, opacity: 0 });
    const side = sv("polygon", { fill: `url(#s${uid})` }), front = sv("polygon", { fill: `url(#f${uid})` }),
      top = sv("polygon", { fill: `url(#t${uid})` }), edge = sv("polyline", { fill: "none", stroke: "rgba(255,240,200,.55)", "stroke-width": 1 });
    const cx = P3((x0 + x1) / 2, 0, z0)[0] + 14;
    const lab = sv("g", { opacity: 0 });
    const tRank = sv("text", { x: cx, "text-anchor": "middle", "font-size": 27, "font-weight": 850, fill: "#ffd27a",
      style: "paint-order:stroke;stroke:#0d1424;stroke-width:5px" }, s.rank ? s.rank + "위" : "—");
    const tVal = sv("text", { x: cx, "text-anchor": "middle", "font-size": 13.5, "font-weight": 700, fill: "#c9d4ea",
      style: "paint-order:stroke;stroke:#0d1424;stroke-width:4px" }, s.rank ? `${s.val} · ${s.ms}` : s.val);
    lab.appendChild(tRank); lab.appendChild(tVal);
    const yr = P3((x0 + x1) / 2, 0, 0);
    svg.appendChild(sv("text", { x: yr[0] - 6, y: yr[1] + 30, "text-anchor": "middle", "font-size": 16, "font-weight": 800, fill: "#dbe4f5" }, s.year + "년"));
    [glow, side, front, top, edge, lab].forEach(n => g.appendChild(n));
    svg.appendChild(g);
    const target = hOf(s.rank);
    const set = k => {                       // k: 0 → 1
      const h = Math.max(target * k, 0.01);
      front.setAttribute("points", pts([P3(x0, 0, z0), P3(x1, 0, z0), P3(x1, h, z0), P3(x0, h, z0)]));
      side.setAttribute("points", pts([P3(x1, 0, z0), P3(x1, 0, z1), P3(x1, h, z1), P3(x1, h, z0)]));
      top.setAttribute("points", pts([P3(x0, h, z0), P3(x1, h, z0), P3(x1, h, z1), P3(x0, h, z1)]));
      edge.setAttribute("points", pts([P3(x0, h, z0), P3(x1, h, z0), P3(x1, h, z1)]));
      glow.setAttribute("opacity", (0.9 * k).toFixed(2));
      const ty = P3(0, h, z1)[1];
      tRank.setAttribute("y", ty - 26); tVal.setAttribute("y", ty - 8);
      lab.setAttribute("opacity", Math.max(0, (k - 0.72) / 0.28).toFixed(2));
    };
    set(0);
    return set;
  });
  return bars;
}

let raf3 = 0;
function play3d() {
  cancelAnimationFrame(raf3);
  const a = draw3d(el("g3cnt"), rankSeries("cnt"), "c"), b = draw3d(el("g3amt"), rankSeries("amt"), "a");
  // 위 그래프가 왼쪽부터 차례로, 이어서 아래 그래프가 차례로 솟는다
  const items = [...a.map((f, i) => [f, i * 230]), ...b.map((f, i) => [f, a.length * 230 + 260 + i * 230])];
  const DUR = 820, ease = t => 1 - Math.pow(1 - t, 3);   // 끝에서 감속
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { items.forEach(([f]) => f(1)); return; }
  const t0 = performance.now();
  const tick = now => {
    let live = false;
    items.forEach(([f, d]) => { const t = Math.min(1, Math.max(0, (now - t0 - d) / DUR));
      f(Math.min(1, Math.max(0, ease(t)))); if (t < 1) live = true; });
    if (live) raf3 = requestAnimationFrame(tick);
  };
  raf3 = requestAnimationFrame(tick);
}
function open3d() {
  const src = (D.ms_ipo || {})[scope] || {}, ys = Object.keys(src).filter(y => y !== "all").sort();
  el("m3sub").textContent = `${ys[0]}년 ~ ${ys[ys.length - 1]}년 상장 · ${scope === "all" ? "스팩·리츠 포함" : "스팩·리츠·인프라펀드 제외"} · 막대가 높을수록 순위가 높습니다`;
  el("modal3d").classList.add("on");
  play3d();
}
function close3d() { el("modal3d").classList.remove("on"); cancelAnimationFrame(raf3); }

async function init() {
  try {
    const r = await fetch("data/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error("dashboard.json " + r.status);
    D = await r.json();
  } catch (e) {
    el("topMeta").textContent = "데이터 로드 실패";
    el("lkList").innerHTML = `<div class="empty">데이터를 불러오지 못했습니다. (${e.message})</div>`;
    return;
  }
  const U = D.meta.universe, C = D.meta.collection || {};
  const ymd = s => s.replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3");
  el("topMeta").innerHTML = `기준일 ${fd(D.meta.baseDate)} · 상장사 ${U.listed.toLocaleString("ko-KR")}개사`;
  el("foot").innerHTML = `출처 ${D.meta.source} · 생성 ${D.meta.generated}<br>`
    + `대상 KOSPI ${U.kospi.toLocaleString("ko-KR")} · KOSDAQ ${U.kosdaq.toLocaleString("ko-KR")}개사<br>`
    + (C.majorstock ? `담보대출 — ${ymd(C.majorstock.period[0])} ~ ${ymd(C.majorstock.period[1])} 접수 대량보유상황보고서(제출인별 최신)·거래소 담보제공 공시<br>` : "")
    + `보호예수 수탁 M/S — 한국거래소(KIND) 신규상장기업현황 ${fd(D.meta.ipoRange[0])} ~ ${fd(D.meta.ipoRange[1])} 코스피·코스닥, IPO 대표주관회사(증권신고서) 기준`;

  document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  el("estOn").onchange = e => { est = e.target.checked; render(); };
  el("btn3d").onclick = open3d;
  el("m3close").onclick = close3d;
  el("m3replay").onclick = play3d;
  el("modal3d").onclick = e => { if (e.target.id === "modal3d") close3d(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") close3d(); });
  if (new URLSearchParams(location.search).get("view") === "samsung3d") open3d();
  const ys = Object.keys((D.ms_ipo || {}).core || D.ms_lockup_by_year || {}).filter(k => k !== "all").sort();
  if (ys.length) year = ys[ys.length - 1];
  el("yearSeg").innerHTML = [["all", "전체"], ...ys.map(y => [y, y + "년"])].map(([k, t]) =>
    `<button data-y="${k}" class="${k === year ? "on" : ""}">${t}</button>`).join("");
  document.querySelectorAll("#scopeSeg button").forEach(b => b.onclick = () => {
    scope = b.dataset.s;
    document.querySelectorAll("#scopeSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  document.querySelectorAll("#yearSeg button").forEach(b => b.onclick = () => {
    year = b.dataset.y;
    document.querySelectorAll("#yearSeg button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  render();
}
init();
</script>
