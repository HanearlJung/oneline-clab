<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>통합 조망 — 락업·담보대출</title>
<link rel="stylesheet" href="assets/base.css" />
<style>
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:14px;overflow:hidden}
  .sum-i{padding:16px 20px;border-right:1px solid var(--line)}
  .sum-i:last-child{border-right:0}
  .sum-l{font-size:11px;font-weight:750;color:#4b5563}
  .sum-v{font-size:26px;font-weight:850;letter-spacing:-.6px;margin-top:5px;line-height:1.15}
  .sum-v .u{font-size:14px;font-weight:750;margin-left:2px}
  .sum-s{font-size:11px;color:var(--muted);margin-top:5px}
  .sum-i.hot .sum-v{color:var(--red)}

  .kindtabs{display:flex;gap:8px;margin-bottom:12px}
  .kt{height:42px;padding:0 20px;border:1px solid #d9dee7;background:#fff;border-radius:11px;
    font-size:14px;font-weight:800;color:#4b5563;cursor:pointer;display:flex;align-items:center;gap:9px}
  .kt small{font-size:11px;font-weight:750;color:#9aa3af}
  .kt.on{border-color:var(--primary);background:var(--primary);color:#fff}
  .kt.on small{color:#c9d9ff}
  .bar{padding:13px 18px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr .9fr;gap:9px;align-items:end}
  .field label{display:block;font-size:11px;font-weight:700;color:#4b5563;margin:0 0 5px 2px}
  input,select{width:100%;height:36px;border:1px solid #d5dbe4;border-radius:8px;padding:0 10px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:#7297ef;box-shadow:0 0 0 3px rgba(36,87,214,.09)}

  .head{min-height:58px;padding:11px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .h-title{font-size:16px;font-weight:780}
  .h-title span{color:var(--primary)}
  .h-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{height:33px;padding:0 12px;border:1px solid #d9dee7;background:#fff;border-radius:8px;
    font-size:12px;font-weight:750;cursor:pointer;color:#4b5563}
  .tab.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
  .btn{height:34px;border:0;border-radius:8px;padding:0 13px;font-weight:750;cursor:pointer;white-space:nowrap}
  .btn-dark{background:var(--navy);color:#fff}

  .wrap{overflow:auto;max-height:640px}
  table{width:100%;border-collapse:separate;border-spacing:0;min-width:1240px;font-size:13px}
  th{position:sticky;top:0;z-index:2;background:#f8fafc;color:#4b5563;font-size:11px;font-weight:780;
    text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.num,td.num{text-align:right}
  th.lk{background:#f2f7ff} th.ln{background:#fff8f0}
  td{padding:10px 11px;border-bottom:1px solid #edf0f4;vertical-align:middle}
  td.lk{background:#fbfdff} td.ln{background:#fffdfa}
  tbody tr{cursor:pointer} tbody tr:hover td{background:#f6f9ff}
  .co{font-weight:800;white-space:nowrap}
  .co-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .dd{font-weight:800;white-space:nowrap;font-size:12px}
  .dd.soon{color:var(--red)} .dd.warn{color:var(--orange)}
  .plus{font-size:10px;color:var(--primary);font-weight:750;margin-left:4px}
  .mock{font-size:9px;color:#9a6b00;background:#fff3d6;border-radius:4px;padding:1px 4px;margin-left:5px;font-weight:800}

  .drawer{position:fixed;inset:0;background:rgba(16,24,39,0);z-index:40;
    visibility:hidden;transition:background .24s ease,visibility 0s linear .3s}
  .drawer.on{background:rgba(16,24,39,.42);visibility:visible;
    transition:background .24s ease,visibility 0s}
  .sheet{position:absolute;right:0;top:0;bottom:0;width:min(1280px,96vw);background:#fff;overflow-y:auto;overflow-x:hidden;
    box-shadow:-14px 0 40px rgba(16,24,39,.18);
    transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.7,.3,1)}
  .drawer.on .sheet{transform:translateX(0)}
  @media(prefers-reduced-motion:reduce){
    .drawer,.drawer.on,.sheet,.drawer.on .sheet{transition:none}
  }
  .sheet-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
    padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;z-index:1}
  .sheet-co{font-size:20px;font-weight:850}
  .sheet-meta{font-size:12px;color:var(--muted);margin-top:4px}
  .x{border:0;background:#eef2f7;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;color:#4b5563}
  .sheet-body{padding:18px 22px 40px}
  .blk{margin-bottom:22px}
  .blk-t{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .tl{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fbfcfe}
  .tl-row{display:grid;grid-template-columns:16px 100px 1fr 110px;gap:11px;align-items:center;
    padding:6px 0;font-size:12px;border-bottom:1px solid #eef1f6}
  .tl-row:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%}
  .dot.lk{background:var(--primary)} .dot.ln{background:var(--orange)}
  .tl-bar{height:7px;border-radius:4px;background:#e8edf5;position:relative}
  .tl-bar i{position:absolute;top:0;bottom:0;width:7px;border-radius:4px}
  .mini{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
  .mini th{position:static;background:#f8fafc;padding:7px 8px;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini td{padding:7px 8px;border-bottom:1px solid #f1f4f8;
    overflow-wrap:anywhere;word-break:break-word;vertical-align:top}
  .mini .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mini col.w-nm{width:15%} .mini col.w-ty{width:9%} .mini col.w-org{width:20%}
  .mini col.w-num{width:12%} .mini col.w-dt{width:11%} .mini col.w-dd{width:9%} .mini col.w-src{width:8%}
  .src{display:inline-flex;align-items:center;justify-content:center;height:25px;padding:0 8px;
    border:1px solid #bfd0fa;border-radius:6px;color:var(--primary);text-decoration:none;font-size:11px;font-weight:750}
  @media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}.sum{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">O</div>
    <div><div class="brand-title">통합 조망</div>
      <div class="brand-sub">보호예수 해제 · 담보대출 만기</div></div></div>
  <nav class="nav">
    <a href="index.html" class="on">통합 조망</a>
    <a href="exec.html">증권사 점유율</a>
  </nav>
  <div class="top-meta" id="topMeta">불러오는 중…</div>
</header>

<main class="page">
  <section class="panel sum" id="sumBar"></section>

  <div class="kindtabs" id="kindTabs"></div>

  <section class="panel bar">
    <div class="grid">
      <div class="field"><label>기업 · 대상자</label><input id="fq" name="fq" placeholder="기업명 또는 이름" autocomplete="off" spellcheck="false" /></div>
      <div class="field"><label id="fOrgLabel">기관</label><select id="fOrg"></select></div>
      <div class="field"><label>시점</label><select id="fWhen">
        <option value="upcoming">예정분(미래)</option><option value="7">7일 이내</option>
        <option value="30">30일 이내</option><option value="90">90일 이내</option>
        <option value="unknown">일정 미상</option><option value="all">전체</option>
      </select></div>
      <div class="field"><label id="fTypeLabel">대상자 유형</label><select id="fType"></select></div>
      <div class="field"><label>금액</label><select id="fAmt">
        <option value="">전체</option><option value="10">10억 이상</option>
        <option value="100">100억 이상</option><option value="500">500억 이상</option>
      </select></div>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <div><div class="h-title"><span id="cnt">0</span>건<span id="badges"></span></div>
        <div class="h-sub">행을 클릭하면 기업 상세가 열립니다.</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="tabs" id="tabs"></div>
        <button class="btn btn-dark" id="csv">CSV</button>
      </div>
    </div>
    <div class="wrap">
      <table><thead id="th"></thead><tbody id="tb"></tbody></table>
    </div>
  </section>
  <div class="foot" id="foot"></div>
</main>

<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>

<script>
const el = id => document.getElementById(id);
const eok = v => { if (v == null) return null; const a = v / 1e8;
  if (a >= 10000) { const j = a / 10000; return (Number.isInteger(j) ? j.toFixed(0) : j.toFixed(1)) + "조"; }
  if (a < 1) return Math.round(v / 1e4).toLocaleString("ko-KR") + "만"; return Math.round(a).toLocaleString("ko-KR") + "억"; };
const fd = s => s ? s.replaceAll("-", ".") : "";
const NA = '<span class="na">미상</span>';
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const capTxt = v => v == null ? NA : v >= 10000 ? (v / 10000).toFixed(1) + "조" : Math.round(v).toLocaleString("ko-KR") + "억";
const PAGE = 200;
let D = null, COS = [], COMAP = new Map(), rows = [], shown = PAGE;
const dd = s => s ? Math.ceil((new Date(s + "T00:00:00") - new Date(D.meta.baseDate + "T00:00:00")) / 86400000) : null;
const ddCell = k => k == null ? NA : k < 0 ? `<span class="na">${-k}일 경과</span>`
  : `<span class="dd ${k <= 7 ? "soon" : k <= 30 ? "warn" : ""}">D-${k}</span>`;

/* 기업 상세 패널용 — 한 기업의 락업·대출을 묶어 둔다.
   목록은 탭별 이벤트 단위라 별개다. */
function buildCompanies() {
  // 공시가 없는 회사도 검색·조회되어야 한다. 상장사 마스터를 먼저 깔고 이벤트를 얹는다.
  const m = new Map();
  (D.companies || []).forEach(c => m.set(c.c, { name: c.n, corp_name: c.n, stock_code: c.c, market: c.m,
    industry: c.i, market_cap: c.cap, lockups: [], loans: [] }));
  const get = x => { if (!m.has(x.stock_code)) m.set(x.stock_code, { name: x.corp_name, corp_name: x.corp_name,
    stock_code: x.stock_code, market: x.market, industry: x.industry, market_cap: x.market_cap, lockups: [], loans: [] });
    return m.get(x.stock_code); };
  D.lockups.forEach(x => get(x).lockups.push(x));
  D.loans.forEach(x => get(x).loans.push(x));
  COMAP = m;
  return [...m.values()];
}

const KINDS = {
  lockup: {
    label: "보호예수 해제", unit: "건",
    sorts: [["date", "해제일순"], ["amount", "금액순"], ["org", "수탁기관순"], ["company", "기업명순"]],
    cols: [
      ["기업", r => `<div class="co">${esc(r.corp_name)}</div><div class="co-sub">${r.stock_code || ""}${r.industry ? " · " + esc(r.industry) : ""}</div>`],
      ["대상자", r => r.holder_name ? esc(r.holder_name) : NA],
      ["구분", r => r.holder_type || NA],
      ["해제일", r => r.release_date
        ? fd(r.release_date) + (r.release_src === "실측기간" ? ' <span class="na" title="예탁일에 이 사유의 실제 보유 기간을 더한 날짜입니다 (한국예탁결제원 반환 내역 기준).">(계산)</span>' : "")
        : NA],
      ["D-day", r => ddCell(dd(r.release_date)), "num"],
      ["수량", r => r.lockup_qty ? r.lockup_qty.toLocaleString("ko-KR") + "주" : NA, "num"],
      ["평가금액", r => r.lockup_value ? eok(r.lockup_value) : NA, "num"],
      ["수탁 증권사", r => r.custody_broker
        ? esc(r.custody_broker) + (r.custody_broker_src === "추정" ? "(추정)" : "")
        : '<span class="na">미상</span>'],
      ["공시", r => r.source_url ? `<a class="src" href="${r.source_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${r.row_source === "KIND" ? "KIND" : "원문"}</a>` : NA],
    ],
    date: r => r.release_date, amount: r => r.lockup_value,
    org: r => r.custody_broker, type: r => r.holder_type, who: r => r.holder_name,
  },
  loan: {
    label: "담보대출 만기", unit: "건",
    sorts: [["date", "만기순"], ["amount", "금액순"], ["org", "대출기관순"], ["company", "기업명순"]],
    cols: [
      ["기업", r => `<div class="co">${esc(r.corp_name)}</div><div class="co-sub">${r.stock_code || ""}${r.industry ? " · " + esc(r.industry) : ""}</div>`],
      ["차주", r => (r.borrower_name ? esc(r.borrower_name) : NA)
        + (r.debtor ? `<div class="co-sub" title="담보제공자와 채무자가 다릅니다 (제3자 채무 담보)">채무자 ${esc(r.debtor)}</div>` : "")],
      ["관계", r => r.borrower_type ? esc(r.borrower_type) : NA],
      ["대출기관", r => r.lender ? esc(r.lender) : '<span class="na">미상</span>'],
      ["대출금액", r => loanAmt(r), "num"],
      ["담보주식", r => r.pledged_qty ? r.pledged_qty.toLocaleString("ko-KR") + "주" : NA, "num"],
      ["지분율", r => r.pledged_ratio != null ? r.pledged_ratio + "%" : NA, "num"],
      ["만기", r => matCell(r)],
      ["D-day", r => ddCell(dd(r.maturity_date)), "num"],
      ["공시", r => `<a class="src" href="${r.source_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">원문</a>`],
    ],
    date: r => r.maturity_date, amount: r => r.loan_amount,
    org: r => r.lender, type: r => r.borrower_type, who: r => r.borrower_name,
  },
};
// 대출금액이 공시되지 않고 담보설정금액만 있는 건(거래소 공시)은 구분해서 보여준다
const loanAmt = r => r.loan_amount ? eok(r.loan_amount)
    + (r.amount_src === "단위추정" ? ' <span class="na" title="공시에 금액 단위가 없어 담보 평가액에 비추어 환산했습니다. 원문을 확인하세요.">단위추정</span>' : "")
    + (r.facility ? ' <span class="na" title="대출금액이 담보 주식 평가액의 3배를 넘습니다. 주식 외 자산이 함께 담보된 여신으로 보고 합계에서 뺍니다.">복합</span>'
      : r.shared_cnt ? ` <span class="na" title="한 대출에 ${r.shared_cnt}건의 담보가 묶여 있습니다. 합계에는 한 번만 셉니다.">공동${r.shared_cnt}</span>` : "")
  : r.collateral_set_amount ? `<span class="na" title="대출금액 미공시 · 담보설정금액">설정 ${eok(r.collateral_set_amount)}</span>` : NA;
// 만기가 없으면 공시에 적힌 기간 표기를 그대로 보여준다 (자동연장·해지시까지 등)
const matCell = r => r.maturity_date
  ? fd(r.maturity_date) + (r.maturity_src === "계산" ? ' <span class="na" title="체결일 + 기재된 기간">(계산)</span>' : "")
  : (r.period_raw && r.period_raw !== "-" ? `<span class="na" title="공시 기재 그대로">${esc(r.period_raw.slice(0, 18))}</span>` : NA);

KINDS.company = {
  label: "전체 상장사", unit: "개사",
  sorts: [["cap", "시가총액순"], ["company", "기업명순"], ["lk", "보호예수순"], ["ln", "담보대출순"]],
  cols: [
    ["기업", r => `<div class="co">${esc(r.corp_name)}</div><div class="co-sub">${r.stock_code || ""}</div>`],
    ["시장", r => r.market || NA],
    ["업종", r => r.industry ? esc(r.industry) : NA],
    ["시가총액", r => capTxt(r.market_cap), "num"],
    ["보호예수", r => r.lockups.length ? r.lockups.length.toLocaleString("ko-KR") + "건" : '<span class="na">없음</span>', "num"],
    ["해제 예정", r => { const n = r.lockups.filter(x => x.is_active).length; return n ? n + "건" : '<span class="na">—</span>'; }, "num"],
    ["담보대출", r => r.loans.length ? r.loans.length.toLocaleString("ko-KR") + "건" : '<span class="na">공시 없음</span>', "num"],
    ["만기 예정", r => { const n = r.loans.filter(x => x.is_active).length; return n ? n + "건" : '<span class="na">—</span>'; }, "num"],
  ],
  date: () => null, amount: r => (r.market_cap || 0) * 1e8,
  org: () => null, type: r => r.market, who: r => r.stock_code,
};
const srcOf = k => k === "lockup" ? D.lockups : k === "loan" ? D.loans : COS;
let kind = "lockup", sortKey = "date";

function setup() {
  el("kindTabs").innerHTML = Object.entries(KINDS).map(([k, v]) => {
    const src = srcOf(k);
    const sub = k === "company"
      ? `${src.length.toLocaleString("ko-KR")}개사 · KOSPI ${D.meta.universe.kospi.toLocaleString("ko-KR")} · KOSDAQ ${D.meta.universe.kosdaq.toLocaleString("ko-KR")}`
      : `${src.length.toLocaleString("ko-KR")}건 · ${new Set(src.map(x => x.stock_code)).size.toLocaleString("ko-KR")}개사`;
    return `<button class="kt ${k === kind ? "on" : ""}" data-k="${k}">${v.label}
      <small>${sub}</small></button>`;
  }).join("");
  document.querySelectorAll(".kt").forEach(b => b.onclick = () => {
    kind = b.dataset.k; sortKey = KINDS[kind].sorts[0][0]; setup(); apply();
  });

  const K = KINDS[kind];
  el("tabs").innerHTML = K.sorts.map(([k, t]) =>
    `<button class="tab ${k === sortKey ? "on" : ""}" data-k="${k}">${t}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { sortKey = b.dataset.k; setup(); apply(); });

  const src = srcOf(kind);
  const orgs = [...new Set(src.map(K.org).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
  el("fOrg").innerHTML = '<option value="">전체</option>' + orgs.map(x => `<option>${esc(x)}</option>`).join("");
  const ts = [...new Set(src.map(K.type).filter(Boolean))].sort();
  el("fType").innerHTML = '<option value="">전체</option>' + ts.map(x => `<option>${esc(x)}</option>`).join("");
  const isCo = kind === "company";
  el("fOrgLabel").textContent = kind === "lockup" ? "수탁 증권사" : isCo ? "보유 공시" : "대출기관";
  if (isCo) el("fOrg").innerHTML = '<option value="">전체</option><option value="lk">보호예수 있음</option>'
    + '<option value="ln">담보대출 있음</option><option value="none">둘 다 없음</option>';
  el("fTypeLabel").textContent = kind === "lockup" ? "대상자 구분" : isCo ? "시장" : "차주 관계";
  el("fWhen").disabled = isCo;
  el("fAmt").previousElementSibling.textContent = isCo ? "시가총액" : "금액";
}

function summary() {
  const L = D.kpi.lockup, N = D.kpi.loan;
  el("sumBar").innerHTML = `
    <div class="sum-i hot"><div class="sum-l">오늘·내일 락업 해제</div>
      <div class="sum-v">${L ? L.d1.cnt : 0}<span class="u">건</span></div>
      <div class="sum-s">${L ? eok(L.d1.amount) + "원 · 7일 내 " + L.d7.cnt + "건" : "—"}</div></div>
    <div class="sum-i"><div class="sum-l">30일 내 락업 해제</div>
      <div class="sum-v">${L ? L.d30.cnt : 0}<span class="u">건</span></div>
      <div class="sum-s">${L ? eok(L.d30.amount) + "원" : "—"}</div></div>
    <div class="sum-i hot"><div class="sum-l">이번 주 대출 만기</div>
      <div class="sum-v">${N.d7.cnt}<span class="u">건</span></div>
      <div class="sum-s">${eok(N.d7.amount)}원 · 30일 내 ${N.d30.cnt}건</div></div>
    <div class="sum-i"><div class="sum-l">대환 제안 가능</div>
      <div class="sum-v">${N.callable_co}<span class="u">개사</span></div>
      <div class="sum-s">계약 ${N.callable_cnt}건 · 만기 미상 ${N.unknown_maturity_cnt}건 제외</div></div>`;
}

function apply() {
  const K = KINDS[kind];
  const q = el("fq").value.trim().toLowerCase();
  const O = el("fOrg").value, W = el("fWhen").value, T = el("fType").value, A = el("fAmt").value;
  const src = srcOf(kind);
  shown = PAGE;
  rows = src.filter(x => {
    if (q && !(x.corp_name.toLowerCase().includes(q) || (x.stock_code || "").includes(q)
      || (K.who(x) || "").toLowerCase().includes(q))) return false;
    if (kind === "company") {
      if (O === "lk" && !x.lockups.length) return false;
      if (O === "ln" && !x.loans.length) return false;
      if (O === "none" && (x.lockups.length || x.loans.length)) return false;
      if (T && x.market !== T) return false;
      if (A && (x.market_cap || 0) < +A) return false;
      return true;
    }
    if (O && K.org(x) !== O) return false;
    if (T && K.type(x) !== T) return false;
    if (A && (K.amount(x) || 0) / 1e8 < +A) return false;
    const d = K.date(x);
    if (W === "all") return true;
    if (W === "unknown") return !d;
    if (!x.is_active) return false;
    if (W === "upcoming") return true;
    const k = dd(d); return k != null && k <= +W;
  });
  const nk = v => v == null ? 1e9 : v < 0 ? 1e6 - v : v;
  rows.sort((a, b) => {
    if (sortKey === "cap") return (b.market_cap || -1) - (a.market_cap || -1);
    if (sortKey === "lk") return b.lockups.length - a.lockups.length || (b.market_cap || 0) - (a.market_cap || 0);
    if (sortKey === "ln") return b.loans.length - a.loans.length || (b.market_cap || 0) - (a.market_cap || 0);
    if (sortKey === "amount") return (K.amount(b) || -1) - (K.amount(a) || -1);
    if (sortKey === "company") return a.corp_name.localeCompare(b.corp_name, "ko");
    if (sortKey === "org") return (K.org(a) || "힣").localeCompare(K.org(b) || "힣", "ko");
    return nk(dd(K.date(a))) - nk(dd(K.date(b)));
  });
  render();
}

function render() {
  const K = KINDS[kind];
  el("cnt").textContent = rows.length.toLocaleString("ko-KR");
  const co = new Set(rows.map(x => x.stock_code)).size;
  el("cnt").nextSibling.textContent = K.unit;
  el("badges").innerHTML = kind === "company" ? "" :
    `<span class="badge ${kind === "lockup" ? "blue" : "orange"}" style="margin-left:8px">${co.toLocaleString("ko-KR")}개사</span>`
    ;
  el("th").innerHTML = "<tr>" + K.cols.map(c =>
    `<th class="${c[2] === "num" ? "num " : ""}${kind === "lockup" ? "lk" : "ln"}">${c[0]}</th>`).join("") + "</tr>";
  if (!rows.length) {
    // 이벤트가 없어도 상장사이면 '없음'을 확인시켜 준다
    const q = el("fq").value.trim().toLowerCase();
    const hit = q && kind !== "company" ? COS.filter(c => c.corp_name.toLowerCase().includes(q) || c.stock_code.includes(q)).slice(0, 8) : [];
    el("tb").innerHTML = `<tr><td colspan="${K.cols.length}"><div class="empty">조건에 맞는 건이 없습니다.${
      hit.length ? `<div style="margin-top:10px">상장사 검색 결과 — ${hit.map(c =>
        `<a class="src" href="#" data-c="${c.stock_code}" style="margin:0 3px">${esc(c.corp_name)}</a>`).join("")}</div>` : ""}</div></td></tr>`;
    document.querySelectorAll("#tb a[data-c]").forEach(a => a.onclick = e => { e.preventDefault(); open(COMAP.get(a.dataset.c)); });
    return;
  }
  // 수천 행을 한 번에 그리면 화면이 멈춘다. 정렬·필터·CSV 는 전체, 그리기만 나눈다.
  const view = rows.slice(0, shown);
  el("tb").innerHTML = view.map((r, i) => "<tr data-i=\"" + i + "\">" +
    K.cols.map(c => `<td class="${c[2] === "num" ? "num " : ""}${kind === "loan" ? "ln" : "lk"}">${c[1](r)}</td>`).join("")
    + "</tr>").join("")
    + (rows.length > shown ? `<tr><td colspan="${K.cols.length}"><div class="empty" style="padding:14px">
        <button class="btn" id="more">${Math.min(PAGE, rows.length - shown).toLocaleString("ko-KR")}${K.unit} 더 보기
        (${shown.toLocaleString("ko-KR")} / ${rows.length.toLocaleString("ko-KR")})</button></div></td></tr>` : "");
  document.querySelectorAll("#tb tr[data-i]").forEach(tr =>
    tr.onclick = () => { const c = COMAP.get(rows[+tr.dataset.i].stock_code); if (c) open(c); });
  if (el("more")) el("more").onclick = () => { shown += PAGE; render(); };
}

function csv() {
  const K = KINDS[kind];
  const h = K.cols.map(c => c[0]).filter(x => x !== "공시");
  const strip = v => String(v).replace(/<[^>]*>/g, "").trim();
  const b = rows.map(r => K.cols.filter(c => c[0] !== "공시").map(c =>
    c[0] === "기업" ? r.corp_name : strip(c[1](r))));
  const t = [[...h, "종목코드", "접수번호", "원문"], ...b.map((row, i) =>
    [...row, rows[i].stock_code, rows[i].rcept_no || "", rows[i].source_url || ""])]
    .map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const u = URL.createObjectURL(new Blob(["\ufeff" + t], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = u; a.download = `${K.label}_${D.meta.baseDate}.csv`; a.click();
  URL.revokeObjectURL(u);
}

function open(c) {
  const ev = [
    ...c.lockups.map(x => ({ t: "lk", d: x.release_date, v: x.lockup_value, who: x.holder_name, org: x.custody_broker })),
    ...c.loans.map(x => ({ t: "ln", d: x.maturity_date, v: x.loan_amount, who: x.borrower_name, org: x.lender })),
  ].filter(x => x.d).sort((a, b) => a.d.localeCompare(b.d));
  const lo = ev[0]?.d, hi = ev[ev.length - 1]?.d;
  const pos = d => (!lo || lo === hi) ? 50 : Math.max(0, Math.min(100, (new Date(d) - new Date(lo)) / (new Date(hi) - new Date(lo)) * 100));
  el("sheet").innerHTML = `
    <div class="sheet-head">
      <div><div class="sheet-co">${esc(c.name)}</div>
        <div class="sheet-meta">${c.stock_code || ""}${c.market ? " · " + c.market : ""}${c.industry ? " · " + esc(c.industry) : ""}${
          c.market_cap ? " · 시총 " + (c.market_cap >= 10000 ? (c.market_cap / 10000).toFixed(1) + "조" : Math.round(c.market_cap).toLocaleString("ko-KR") + "억") : ""}</div></div>
      <button class="x" onclick="closeD()">✕</button></div>
    <div class="sheet-body">
      <div class="blk"><div class="blk-t">일정 타임라인 <span class="badge">${ev.length}건</span>
        <span class="badge blue">락업</span><span class="badge orange">대출</span></div>
        ${ev.length ? `<div class="tl">${ev.map(x => `<div class="tl-row">
          <div class="dot ${x.t}"></div><div>${fd(x.d)}</div>
          <div class="tl-bar"><i class="" style="left:calc(${pos(x.d)}% - 3px);background:${x.t === "lk" ? "var(--primary)" : "var(--orange)"}"></i></div>
          <div style="text-align:right;font-weight:750">${x.v ? eok(x.v) : "—"}</div></div>`).join("")}</div>`
          : '<div class="tl" style="color:var(--muted);font-size:12px">일정이 확보된 건이 없습니다.</div>'}
      </div>
      <div class="blk"><div class="blk-t">보호예수 <span class="badge">${c.lockups.length}건</span></div>
        ${c.lockups.length ? `<table class="mini">
          <colgroup><col class="w-nm"><col class="w-ty"><col class="w-num"><col class="w-num">
            <col class="w-dt"><col class="w-dd"><col class="w-org"></colgroup>
          <thead><tr><th>대상자</th><th>구분</th><th class="n">수량</th>
          <th class="n">평가금액</th><th>해제일</th><th class="n">D-day</th><th>수탁 증권사</th></tr></thead>
          <tbody>${c.lockups.map(x => `<tr><td>${esc(x.holder_name)}</td><td>${x.holder_type}</td>
          <td class="n">${x.lockup_qty.toLocaleString("ko-KR")}</td>
          <td class="n">${x.lockup_value ? eok(x.lockup_value) : NA}</td><td>${x.release_date ? fd(x.release_date) : NA}</td>
          <td class="n">${ddCell(dd(x.release_date))}</td>
          <td>${x.custody_broker ? esc(x.custody_broker) + (x.custody_broker_src === "추정" ? "(추정)" : "") : NA}</td></tr>`).join("")}</tbody></table>
          ${c.lockups[0].lead_manager ? `<div class="tl" style="color:var(--muted);font-size:12px;margin-top:6px">주관 ${esc(c.lockups[0].lead_manager)}${
            c.lockups[0].co_manager ? " · 공동주관 " + esc(c.lockups[0].co_manager) : ""}${
            c.lockups[0].underwriter ? " · 인수 " + esc(c.lockups[0].underwriter) : ""}${
            c.lockups[0].prospectus_rcept_no ? ` · <a class="src" href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${c.lockups[0].prospectus_rcept_no}" target="_blank" rel="noopener">증권신고서</a>` : ""}</div>` : ""}
          ${c.lockups.some(x => x.row_source === "KIND") ? `<div class="tl" style="color:var(--muted);font-size:12px;margin-top:4px">기관 의무보유확약·우리사주 등 이름 없는 행은 KIND 신규상장기업 유통가능주식수 현황의 분류 단위 물량입니다.</div>` : ""}`
          : `<div class="tl" style="color:var(--muted);font-size:12px">보호예수 없음 — ${D.meta.lockupScope || "최근 신규상장 종목이 아닙니다"}</div>`}
      </div>
      <div class="blk"><div class="blk-t">주식담보대출 <span class="badge">${c.loans.length}건</span></div>
        ${c.loans.length ? `<table class="mini">
          <colgroup><col class="w-nm"><col class="w-ty"><col class="w-org"><col class="w-num">
            <col class="w-dd"><col class="w-dt"><col class="w-dd"><col class="w-src"></colgroup>
          <thead><tr><th>차주</th><th>관계</th><th>기관</th>
          <th class="n">금액</th><th class="n">지분율 · 금리</th><th>만기</th><th class="n">D-day</th><th>공시</th></tr></thead>
          <tbody>${c.loans.map(x => `<tr><td>${x.borrower_name ? esc(x.borrower_name) : NA}${
            x.debtor ? `<div class="co-sub">채무자 ${esc(x.debtor)}</div>` : ""}</td><td>${x.borrower_type ? esc(x.borrower_type) : NA}</td>
          <td>${x.lender ? esc(x.lender) : NA}</td><td class="n">${loanAmt(x)}</td>
          <td class="n">${x.pledged_ratio != null ? x.pledged_ratio + "%" : NA}${
            x.interest_rate ? `<div class="co-sub" title="담보유지비율 ${x.maintenance_ratio ? x.maintenance_ratio + "%" : "미상"}">금리 ${x.interest_rate}%</div>` : ""}</td>
          <td>${matCell(x)}</td><td class="n">${ddCell(dd(x.maturity_date))}</td>
          <td><a class="src" href="${x.source_url}" target="_blank" rel="noopener">원문</a></td></tr>`).join("")}</tbody></table>`
          : `<div class="tl" style="color:var(--muted);font-size:12px">담보계약 공시 없음 — ${D.meta.loanScope || ""}</div>`}
      </div>
    </div>`;
  el("sheet").scrollTop = 0;
  el("drawer").classList.add("on");
}
function closeD() { el("drawer").classList.remove("on"); }
el("drawer").onclick = e => { if (e.target.id === "drawer") closeD(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeD(); });


async function init() {
  try {
    const r = await fetch("data/dashboard.json", { cache: "no-store" });
    if (!r.ok) throw new Error("dashboard.json " + r.status);
    D = await r.json();
  } catch (e) {
    el("topMeta").textContent = "데이터 로드 실패";
    el("tb").innerHTML = `<tr><td colspan="10"><div class="empty">데이터를 불러오지 못했습니다. (${e.message})</div></td></tr>`;
    return;
  }
  COS = buildCompanies();
  const U = D.meta.universe, C = D.meta.collection || {};
  const per = k => C[k] ? `${C[k].period[0].replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3")} ~ ${C[k].period[1].replace(/(\d{4})(\d{2})(\d{2})/, "$1.$2.$3")}` : "";
  D.meta.loanScope = C.majorstock ? `${per("majorstock")} 접수 대량보유상황보고서·거래소 담보제공 공시 기준` : "";
  D.meta.lockupScope = "2022년 이후 신규상장 종목의 의무보유(증권신고서) 기준";
  el("topMeta").innerHTML = `기준일 ${fd(D.meta.baseDate)} · 상장사 ${U.listed.toLocaleString("ko-KR")}개사`;
  el("foot").innerHTML = `출처 ${D.meta.source} · 생성 ${D.meta.generated}<br>`
    + `대상 KOSPI ${U.kospi.toLocaleString("ko-KR")} · KOSDAQ ${U.kosdaq.toLocaleString("ko-KR")}개사 `
    + `(담보대출 공시 ${U.with_loan.toLocaleString("ko-KR")}개사 · 보호예수 ${U.with_lockup.toLocaleString("ko-KR")}개사)<br>`
    + `담보대출 — ${D.meta.loanScope}<br>보호예수 — ${D.meta.lockupScope} · 수탁 증권사는 대표주관회사 기준 추정<br>`
    + `평가금액 — ${fd(D.meta.priceDate)} 종가 기준`;
  // 주소로 상태를 넘겨받는다 — 점유율 화면에서 기관명을 누르면 그 기관 건만 걸러서 연다
  const Q = new URLSearchParams(location.search);
  if (KINDS[Q.get("kind")]) { kind = Q.get("kind"); sortKey = KINDS[kind].sorts[0][0]; }
  setup(); summary();
  if (Q.get("q")) el("fq").value = Q.get("q");
  if (Q.get("org")) { const o = [...el("fOrg").options].find(x => x.value === Q.get("org") || x.text === Q.get("org")); if (o) el("fOrg").value = o.value; }
  if (Q.get("when")) el("fWhen").value = Q.get("when");
  apply();
  if (Q.get("open") && COMAP.get(Q.get("open"))) open(COMAP.get(Q.get("open")));
  el("fq").addEventListener("input", apply);
  ["fOrg", "fWhen", "fType", "fAmt"].forEach(id => el(id).addEventListener("change", apply));
  el("csv").onclick = csv;
}
init();
</script>
