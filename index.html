<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법인영업 타깃 발굴</title>
  <style>
    :root{
      --bg:#f5f7fb; --panel:#fff; --text:#152033; --muted:#6b7280;
      --line:#e5e9f0; --primary:#2457d6; --primary-soft:#edf3ff;
      --navy:#101827; --green:#087a55; --green-soft:#eaf8f2;
      --orange:#b45309; --orange-soft:#fff5e8; --red:#b42318;
      --red-soft:#fff0ee; --shadow:0 10px 28px rgba(16,24,39,.07);
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",
      Roboto,"Noto Sans KR",Arial,sans-serif;line-height:1.45;
    }
    button,input,select{font:inherit}
    .topbar{
      height:66px;background:var(--navy);color:#fff;padding:0 28px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{display:flex;align-items:center;gap:11px}
    .logo{
      width:34px;height:34px;border-radius:9px;background:#3f6ff0;
      display:grid;place-items:center;font-weight:800;
    }
    .brand-title{font-size:17px;font-weight:750}
    .brand-sub{font-size:11px;color:#aeb8c7;margin-top:2px}
    .top-meta{font-size:12px;color:#c9d2df;text-align:right}
    .page{width:min(1460px,calc(100% - 40px));margin:24px auto 42px}
    .hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
    .hero h1{margin:0;font-size:25px;letter-spacing:-.5px}
    .hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
    .demo{font-size:12px;color:var(--muted);text-align:right;line-height:1.6}
    .panel{
      background:var(--panel);border:1px solid var(--line);border-radius:14px;
      box-shadow:var(--shadow);
    }
    .purpose-panel{padding:20px;margin-bottom:16px}
    .section-label{font-size:12px;font-weight:750;color:#4b5563;margin-bottom:9px}
    .purpose-row{
      display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;
    }
    .purpose-btn{
      min-height:84px;border:1px solid #d9dee7;background:#fff;border-radius:11px;
      padding:12px 13px;text-align:left;cursor:pointer;transition:.15s ease;
    }
    .purpose-btn:hover{border-color:#9bb6f6;transform:translateY(-1px)}
    .purpose-btn.active{
      border-color:var(--primary);background:var(--primary-soft);
      box-shadow:0 0 0 2px rgba(36,87,214,.08);
    }
    .purpose-title{font-size:14px;font-weight:780}
    .purpose-desc{font-size:11px;color:var(--muted);margin-top:5px}
    .purpose-cov{font-size:10px;font-weight:750;color:#4b5563;margin-top:7px}
    .purpose-btn.active .purpose-cov{color:var(--primary)}

    .upcoming-panel{padding:20px;margin-bottom:16px}
    .upcoming-head{
      display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
      margin-bottom:13px;
    }
    .upcoming-title{font-size:17px;font-weight:800}
    .upcoming-sub{font-size:12px;color:var(--muted);margin-top:3px}
    .upcoming-badge{
      background:var(--red-soft);color:var(--red);font-size:11px;font-weight:800;
      padding:6px 9px;border-radius:999px;white-space:nowrap;
    }
    .upcoming-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .deal-card{
      border:1px solid var(--line);border-radius:12px;padding:15px;background:#fff;
      position:relative;overflow:hidden;
    }
    .deal-card:first-child{border-color:#a9bff7;background:#fbfdff}
    .deal-rank{
      position:absolute;right:12px;top:12px;width:25px;height:25px;border-radius:50%;
      background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;
      font-size:11px;font-weight:850;
    }
    .deal-company{font-size:15px;font-weight:850;padding-right:34px}
    .deal-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .deal-reason{font-size:13px;font-weight:730;margin-top:13px}
    .deal-detail{font-size:11px;color:var(--muted);margin-top:4px;min-height:33px}
    .deal-bottom{
      display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
      margin-top:13px;padding-top:12px;border-top:1px solid #edf0f4;
    }
    .deal-date-label{font-size:10px;color:var(--muted)}
    .deal-date{font-size:13px;font-weight:850;color:var(--red);margin-top:2px}
    .deal-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
    .deal-action{font-size:11px;color:#173f9f;font-weight:750;text-align:right;max-width:220px}
    .deal-source{
      display:inline-flex;align-items:center;justify-content:center;height:30px;
      padding:0 11px;border:1px solid #bfd0fa;border-radius:7px;color:var(--primary);
      background:#fff;text-decoration:none;font-size:11px;font-weight:800;white-space:nowrap;
    }
    .deal-source:hover{background:var(--primary-soft)}

    .filter-panel{padding:16px 20px;margin-bottom:16px}
    .filter-header{
      display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
    }
    .filter-title{font-size:13px;font-weight:800}
    .filter-guide{font-size:11px;color:var(--muted)}
    .filter-grid{
      display:grid;grid-template-columns:1.15fr .85fr 1fr 1fr 1fr;gap:10px;align-items:end;
    }
    .field label{display:block;font-size:11px;font-weight:700;color:#4b5563;margin:0 0 6px 2px}
    input,select{
      width:100%;height:40px;border:1px solid #d5dbe4;border-radius:8px;
      padding:0 11px;background:#fff;color:var(--text);outline:none;
    }
    input:focus,select:focus{border-color:#7297ef;box-shadow:0 0 0 3px rgba(36,87,214,.09)}
    .field.hidden{visibility:hidden}

    .result-panel{overflow:hidden}
    .result-head{
      min-height:67px;padding:13px 18px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .result-title{font-size:16px;font-weight:780}
    .result-title span{color:var(--primary)}
    .result-sub{font-size:12px;color:var(--muted);margin-top:3px}
    .cov-badge{
      display:inline-flex;align-items:center;gap:5px;margin-left:8px;
      background:var(--green-soft);color:var(--green);font-size:11px;font-weight:800;
      padding:4px 9px;border-radius:999px;vertical-align:2px;
    }
    .cov-badge.warn{background:var(--orange-soft);color:var(--orange)}
    .head-actions{display:flex;gap:8px;align-items:center}
    .head-actions select{width:200px;height:38px}
    .btn{
      height:38px;border:0;border-radius:8px;padding:0 15px;font-weight:750;
      cursor:pointer;white-space:nowrap;
    }
    .btn-dark{background:var(--navy);color:#fff}
    .table-wrap{overflow:auto;max-height:610px}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:1180px;font-size:13px}
    th{
      position:sticky;top:0;z-index:2;background:#f8fafc;color:#4b5563;
      font-size:11px;font-weight:780;text-align:left;padding:11px 13px;
      border-bottom:1px solid var(--line);white-space:nowrap;
    }
    td{padding:13px;border-bottom:1px solid #edf0f4;vertical-align:top}
    tbody tr:hover{background:#fafcff}
    .company{font-weight:800;white-space:nowrap}
    .company-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .reason{font-weight:680;max-width:310px}
    .reason-detail{font-size:11px;color:var(--muted);margin-top:4px;white-space:normal}
    .action{max-width:300px;white-space:normal}
    .action strong{color:#173f9f}
    .metric{font-weight:800;white-space:nowrap}
    .date{white-space:nowrap}
    .date-sub{font-size:10px;color:var(--muted);margin-top:3px;font-weight:400}
    .na{color:#9aa3af;font-weight:600}
    .chips{display:flex;gap:5px;flex-wrap:wrap;max-width:230px}
    .chip{
      display:inline-flex;align-items:center;border-radius:999px;padding:4px 7px;
      font-size:10px;font-weight:750;background:#eef2f7;color:#4b5563;white-space:nowrap;
    }
    .chip.blue{background:var(--primary-soft);color:var(--primary)}
    .chip.green{background:var(--green-soft);color:var(--green)}
    .chip.orange{background:var(--orange-soft);color:var(--orange)}
    .source{
      display:inline-flex;align-items:center;justify-content:center;height:29px;
      padding:0 9px;border:1px solid #bfd0fa;border-radius:7px;color:var(--primary);
      text-decoration:none;font-size:11px;font-weight:750;white-space:nowrap;
    }
    .empty{padding:70px 20px;text-align:center;color:var(--muted)}
    .foot{font-size:11px;color:var(--muted);text-align:right;margin-top:9px}
    @media(max-width:1200px){
      .purpose-row{grid-template-columns:repeat(3,1fr)}
      .upcoming-grid{grid-template-columns:1fr}
      .filter-grid{grid-template-columns:repeat(2,1fr)}
      .hero{align-items:flex-start;flex-direction:column;gap:8px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">O</div>
      <div>
        <div class="brand-title">법인영업 타깃 발굴</div>
        <div class="brand-sub">공시 데이터 기반 영업 대상 기업 조회</div>
      </div>
    </div>
    <div class="top-meta" id="topMeta">데이터 불러오는 중…</div>
  </header>

  <main class="page">
    <div class="hero">
      <div>
        <h1>어떤 영업을 할지 선택하세요</h1>
        <p>선택하는 즉시 가장 먼저 접촉해야 할 영업건부터 보여줍니다.</p>
      </div>
      <div class="demo" id="heroNote"></div>
    </div>

    <section class="panel purpose-panel">
      <div class="section-label">영업 목적</div>
      <div class="purpose-row" id="purposeRow"></div>
    </section>

    <section class="panel upcoming-panel">
      <div class="upcoming-head">
        <div>
          <div class="upcoming-title">가장 먼저 접촉할 영업건</div>
          <div class="upcoming-sub" id="upcomingSub"></div>
        </div>
        <div class="upcoming-badge" id="upcomingBadge">우선순위 순</div>
      </div>
      <div class="upcoming-grid" id="upcomingGrid"></div>
    </section>

    <section class="panel filter-panel">
      <div class="filter-header">
        <div class="filter-title">결과 좁히기</div>
        <div class="filter-guide">선택 사항 · 조건을 바꾸면 즉시 반영됩니다.</div>
      </div>
      <div class="filter-grid">
        <div class="field">
          <label>기업명</label>
          <input id="companySearch" placeholder="기업명 검색" />
        </div>
        <div class="field">
          <label>시장</label>
          <select id="market">
            <option value="">전체</option>
            <option value="KOSPI">코스피</option>
            <option value="KOSDAQ">코스닥</option>
          </select>
        </div>
        <div class="field" id="industryField">
          <label>업종</label>
          <select id="industry"></select>
        </div>
        <div class="field" id="f1Field">
          <label id="filter1Label"></label>
          <select id="filter1"></select>
        </div>
        <div class="field" id="f2Field">
          <label id="filter2Label"></label>
          <select id="filter2"></select>
        </div>
      </div>
    </section>

    <section class="panel result-panel">
      <div class="result-head">
        <div>
          <div class="result-title">
            대상 기업 <span id="count">0</span>개<span id="covBadge"></span>
          </div>
          <div class="result-sub" id="resultSub"></div>
        </div>
        <div class="head-actions">
          <select id="sort"></select>
          <button class="btn btn-dark" id="download">CSV 다운로드</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>기업</th>
              <th>왜 대상인가</th>
              <th id="thMetric">관련 규모</th>
              <th id="thTime">권장 영업일 / D-day</th>
              <th>제안 방향</th>
              <th>활용 데이터</th>
              <th>공시</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <div class="foot" id="foot"></div>
  </main>

<script>
const CHIP_COLOR = {
  "금융자산":"blue","투자이력":"green","주식담보":"orange","자사주":"blue",
  "퇴직연금":"green","주식보상":"blue","대주주변경":"orange","임원퇴임":"green",
  "최대주주":"orange"
};

let DATA = null;      // site_data.json 전체
let activeKey = null; // 현재 탭 key
let rows = [];        // 현재 화면에 보이는 행

const el = id => document.getElementById(id);

/* ---------------------------------------------------------------- 유틸 */

// amount 는 억원 단위로 통일되어 들어온다
function eok(v){
  if(v == null) return null;
  if(v >= 10000){
    const j = v / 10000;
    return (Number.isInteger(j) ? j.toFixed(0) : j.toFixed(1)) + "조원";
  }
  return Math.round(v).toLocaleString("ko-KR") + "억원";
}

function baseDate(){
  return DATA ? new Date(DATA.meta.baseDate + "T00:00:00") : new Date();
}

function dayDiff(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  return Math.ceil((d - baseDate()) / 86400000);
}

function fmtDate(s){ return s ? s.replaceAll("-", ".") : ""; }

// 시간 열 텍스트. 항목마다 날짜의 성격이 달라 mode 로 분기한다.
function timeCell(tab, r){
  const mode = tab.timeColumn.mode;
  if(mode === "none")  return {main: r.timeText ?? "-", sub: ""};
  if(mode === "range") return {main: r.timeText ?? "구간 미공시", sub: ""};
  if(!r.dateValue)     return {main: r.timeText ?? "미공시", sub: "", na: true};

  const diff = dayDiff(r.dateValue);
  if(mode === "elapsed"){
    // 변경일이 미래면 아직 발생 전이다. '경과'로 쓰면 거꾸로 읽힌다.
    return diff > 0
      ? {main: fmtDate(r.dateValue), sub: `변경 예정 D-${diff}`}
      : {main: fmtDate(r.dateValue), sub: `발생 후 ${-diff}일 경과`};
  }
  // dday — 지난 날짜를 D-DAY 로 쓰면 끝난 건이 임박 건으로 보인다
  if(diff < 0)  return {main: fmtDate(r.dateValue), sub: `${-diff}일 경과`, na: true};
  if(diff === 0) return {main: fmtDate(r.dateValue), sub: "D-DAY"};
  return {main: fmtDate(r.dateValue), sub: `D-${diff}`};
}

function sortValue(r, key){
  if(key === "amount") return -(r.amount ?? -Infinity);
  if(key === "ratio")  return r.ratio ?? Infinity;
  if(key === "date"){
    const d = dayDiff(r.dateValue);
    if(d == null) return Infinity;      // 날짜 없는 건은 맨 뒤
    if(d < 0)     return 1e6 - d;       // 지난 건은 그보다 더 뒤
    return d;                            // 임박한 미래 건이 앞
  }
  return 0;
}

/* -------------------------------------------------------------- 렌더링 */

function currentTab(){ return DATA.tabs.find(t => t.key === activeKey); }

function renderPurpose(){
  el("purposeRow").innerHTML = DATA.tabs.map(t => `
    <button class="purpose-btn ${t.key === activeKey ? "active" : ""}" data-key="${t.key}">
      <div class="purpose-title">${t.title}</div>
      <div class="purpose-desc">${t.desc}</div>
      <div class="purpose-cov">${t.coverage.covered}/${t.coverage.total}개사</div>
    </button>`).join("");
  document.querySelectorAll(".purpose-btn").forEach(b =>
    b.onclick = () => setTab(b.dataset.key));
}

function optionsHtml(options){
  return options.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
}

function setupFilters(tab){
  const fields = [["f1Field","filter1Label","filter1"], ["f2Field","filter2Label","filter2"]];
  fields.forEach(([fieldId, labelId, selId], i) => {
    const f = tab.filters[i];
    if(!f){ el(fieldId).classList.add("hidden"); el(selId).innerHTML = ""; return; }
    el(fieldId).classList.remove("hidden");
    el(labelId).textContent = f.label;
    el(selId).innerHTML = optionsHtml(f.options);
  });

  // 업종은 원문에 없는 경우가 있어, 값이 있는 탭에서만 노출한다
  const inds = [...new Set(tab.rows.map(r => r.industry).filter(Boolean))].sort();
  if(inds.length){
    el("industryField").classList.remove("hidden");
    el("industry").innerHTML = '<option value="">전체</option>' +
      inds.map(x => `<option value="${x}">${x}</option>`).join("");
  }else{
    el("industryField").classList.add("hidden");
    el("industry").innerHTML = '<option value="">전체</option>';
  }
}

function setTab(key){
  activeKey = key;
  const tab = currentTab();
  el("companySearch").value = "";
  el("market").value = "";
  el("industry").value = "";
  renderPurpose();
  setupFilters(tab);

  el("upcomingSub").textContent = tab.upcoming;
  el("upcomingBadge").textContent = tab.upcomingBadge || "우선순위 순";
  el("thMetric").textContent = tab.metricLabel;
  el("thTime").textContent = tab.timeColumn.label;
  el("sort").innerHTML = optionsHtml(tab.sortOptions);
  el("sort").value = tab.sortDefault;
  apply();
}

function passesFilter(r, f, value){
  if(!value) return true;
  if(f.type === "min") return (r[f.field] ?? -Infinity) >= Number(value);
  if(f.type === "max") return (r[f.field] ??  Infinity) <  Number(value);
  if(f.type === "eq")  return r[f.field] === value;
  if(f.type === "withinMonths"){
    const d = dayDiff(r.dateValue);
    return d != null && d >= 0 && d <= Number(value) * 31;
  }
  return true;
}

function apply(){
  const tab = currentTab();
  const q = el("companySearch").value.trim().toLowerCase();
  const market = el("market").value, industry = el("industry").value;
  const vals = [el("filter1").value, el("filter2").value];

  let data = tab.rows.filter(r =>
    (!q || r.name.toLowerCase().includes(q)) &&
    (!market || r.market === market) &&
    (!industry || r.industry === industry) &&
    tab.filters.every((f, i) => passesFilter(r, f, vals[i]))
  );

  const key = el("sort").value;
  if(key === "company"){
    data.sort((a, b) => a.name.localeCompare(b.name, "ko"));
  }else{
    data.sort((a, b) => sortValue(a, key) - sortValue(b, key));
  }

  rows = data;
  renderUpcoming(tab);
  renderTable(tab);
}

function renderUpcoming(tab){
  const top = rows.slice(0, 3);
  if(!top.length){
    el("upcomingGrid").innerHTML =
      '<div class="empty" style="grid-column:1/-1;padding:35px 20px">조건에 맞는 영업건이 없습니다.</div>';
    return;
  }
  el("upcomingGrid").innerHTML = top.map((r, i) => {
    const t = timeCell(tab, r);
    return `
    <article class="deal-card">
      <div class="deal-rank">${i + 1}</div>
      <div class="deal-company">${r.name}</div>
      <div class="deal-meta">${r.market}${r.industry ? " · " + r.industry : ""}</div>
      <div class="deal-reason">${r.reason}</div>
      <div class="deal-detail">${r.detail ?? ""}</div>
      <div class="deal-bottom">
        <div>
          <div class="deal-date-label">${tab.timeColumn.label}</div>
          <div class="deal-date">${t.main}${t.sub ? " · " + t.sub : ""}</div>
        </div>
        <div class="deal-right">
          <div class="deal-action">${r.action}</div>
          <a class="deal-source" href="${r.sourceUrl}" target="_blank" rel="noopener">원문 보기</a>
        </div>
      </div>
    </article>`;
  }).join("");
}

function renderTable(tab){
  el("count").textContent = rows.length.toLocaleString("ko-KR");

  const cov = tab.coverage;
  const pct = cov.total ? Math.round(cov.covered / cov.total * 100) : 0;
  el("covBadge").innerHTML =
    `<span class="cov-badge ${pct < 30 ? "warn" : ""}">전체 ${cov.total}개사 중 ${cov.covered}개사 해당</span>`;
  el("resultSub").textContent =
    `${tab.title} 영업에 바로 활용할 수 있는 대상과 근거입니다. 값이 공시되지 않은 기업은 제외했습니다.`;

  if(!rows.length){
    el("tbody").innerHTML =
      '<tr><td colspan="7"><div class="empty">조건에 맞는 기업이 없습니다.</div></td></tr>';
    return;
  }

  el("tbody").innerHTML = rows.map(r => {
    const t = timeCell(tab, r);
    return `
    <tr>
      <td>
        <div class="company">${r.name}</div>
        <div class="company-sub">${r.market}${r.industry ? " · " + r.industry : ""}</div>
      </td>
      <td>
        <div class="reason">${r.reason}</div>
        <div class="reason-detail">${r.detail ?? ""}</div>
      </td>
      <td class="metric">${r.metricText ?? eok(r.amount) ?? '<span class="na">미공시</span>'}</td>
      <td class="date">
        <div class="${t.na ? "na" : ""}">${t.main}</div>
        ${t.sub ? `<div class="date-sub">${t.sub}</div>` : ""}
        ${r.asOf ? `<div class="date-sub">기준 ${fmtDate(r.asOf)}</div>` : ""}
      </td>
      <td class="action"><strong>${r.action}</strong></td>
      <td><div class="chips">${(r.chips || []).map(c =>
        `<span class="chip ${CHIP_COLOR[c] || ""}">${c}</span>`).join("")}</div></td>
      <td><a class="source" href="${r.sourceUrl}" target="_blank" rel="noopener">원문 보기</a></td>
    </tr>`;
  }).join("");
}

function download(){
  const tab = currentTab();
  const headers = ["기업명","시장","업종","왜 대상인가","상세 근거",tab.metricLabel,
                   tab.timeColumn.label,"기준일","제안 방향","활용 데이터","공시 원문"];
  const csv = [headers, ...rows.map(r => {
    const t = timeCell(tab, r);
    return [r.name, r.market, r.industry ?? "", r.reason, r.detail ?? "",
            r.metricText ?? eok(r.amount) ?? "미공시",
            [t.main, t.sub].filter(Boolean).join(" "), r.asOf ?? "",
            r.action, (r.chips || []).join("|"), r.sourceUrl];
  })].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");

  const blob = new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${tab.title}_영업대상.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ------------------------------------------------------------------ 시작 */

async function init(){
  try{
    const res = await fetch("data/site_data.json", {cache:"no-store"});
    if(!res.ok) throw new Error(`site_data.json ${res.status}`);
    DATA = await res.json();
  }catch(err){
    el("topMeta").textContent = "데이터 로드 실패";
    el("purposeRow").innerHTML =
      `<div class="empty" style="grid-column:1/-1">데이터를 불러오지 못했습니다. (${err.message})</div>`;
    return;
  }

  el("topMeta").innerHTML =
    `상장사 ${DATA.meta.companyCount}개사 · 기준일 ${fmtDate(DATA.meta.baseDate)}`;
  el("heroNote").innerHTML =
    `DART 공시 원문에서 추출한 실제 데이터입니다.<br>` +
    `항목별로 원천 공시가 달라 기준일이 기업마다 다를 수 있습니다.`;
  el("foot").textContent =
    `출처: 금융감독원 전자공시시스템(DART) · 생성 ${DATA.meta.generated}`;

  activeKey = DATA.tabs[0].key;
  setTab(activeKey);
}

el("companySearch").addEventListener("input", apply);
["market","industry","filter1","filter2","sort"].forEach(id =>
  el(id).addEventListener("change", apply));
el("download").onclick = download;

init();
</script>
