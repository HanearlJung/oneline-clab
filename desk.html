<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>락업·담보대출 조회 — 영업 실무</title>
<link rel="stylesheet" href="assets/base.css" />
<style>
  .bar{padding:14px 18px;margin-bottom:14px}
  .bar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .bar-title{font-size:13px;font-weight:800}
  .bar-guide{font-size:11px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1.2fr 1fr 1fr .9fr .9fr;gap:10px;align-items:end}
  .field label{display:block;font-size:11px;font-weight:700;color:#4b5563;margin:0 0 5px 2px}
  input,select{width:100%;height:38px;border:1px solid #d5dbe4;border-radius:8px;padding:0 10px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:#7297ef;box-shadow:0 0 0 3px rgba(36,87,214,.09)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{height:34px;padding:0 13px;border:1px solid #d9dee7;background:#fff;border-radius:8px;
    font-size:12px;font-weight:750;cursor:pointer;color:#4b5563}
  .tab.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
  .btn{height:36px;border:0;border-radius:8px;padding:0 14px;font-weight:750;cursor:pointer;white-space:nowrap}
  .btn-dark{background:var(--navy);color:#fff}
  .btn-line{background:#fff;border:1px solid #bfd0fa;color:var(--primary)}

  .head{min-height:62px;padding:12px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .h-title{font-size:16px;font-weight:780}
  .h-title span{color:var(--primary)}
  .h-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .h-act{display:flex;gap:8px;align-items:center}

  .wrap{overflow:auto;max-height:620px}
  table{width:100%;border-collapse:separate;border-spacing:0;min-width:1180px;font-size:13px}
  th{position:sticky;top:0;z-index:2;background:#f8fafc;color:#4b5563;font-size:11px;font-weight:780;
    text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.num,td.num{text-align:right}
  td{padding:11px 12px;border-bottom:1px solid #edf0f4;vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fafcff}
  tbody tr.grp td{border-top:1px solid #e5e9f0}
  .co{font-weight:800;white-space:nowrap}
  .co-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .co-cont{color:#b6bec9;font-weight:700}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .dday{font-weight:800;white-space:nowrap}
  .dday.soon{color:var(--red)}
  .src{display:inline-flex;align-items:center;justify-content:center;height:27px;padding:0 9px;
    border:1px solid #bfd0fa;border-radius:7px;color:var(--primary);text-decoration:none;font-size:11px;font-weight:750}

  .drawer{position:fixed;inset:0;background:rgba(16,24,39,.42);display:none;z-index:40}
  .drawer.on{display:block}
  .sheet{position:absolute;right:0;top:0;bottom:0;width:min(720px,92vw);background:#fff;
    overflow:auto;box-shadow:-14px 0 40px rgba(16,24,39,.18)}
  .sheet-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
    padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .sheet-co{font-size:20px;font-weight:850}
  .sheet-meta{font-size:12px;color:var(--muted);margin-top:4px}
  .x{border:0;background:#eef2f7;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;color:#4b5563}
  .sheet-body{padding:18px 22px 40px}
  .blk{margin-bottom:22px}
  .blk-t{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .tl{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fbfcfe}
  .tl-row{display:grid;grid-template-columns:96px 1fr 92px;gap:10px;align-items:center;
    padding:7px 0;font-size:12px;border-bottom:1px solid #eef1f6}
  .tl-row:last-child{border-bottom:0}
  .tl-bar{height:8px;border-radius:4px;background:#e8edf5;position:relative}
  .tl-bar i{position:absolute;top:0;bottom:0;width:8px;border-radius:4px;background:var(--primary)}
  .mini{width:100%;border-collapse:collapse;font-size:12px}
  .mini th{position:static;background:#f8fafc;padding:8px 10px;font-size:11px}
  .mini td{padding:8px 10px;border-bottom:1px solid #f1f4f8}
  @media(max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">O</div>
    <div>
      <div class="brand-title">락업·담보대출 조회</div>
      <div class="brand-sub">DART 공시 기반 · 삼성증권 C-Lab</div>
    </div>
  </div>
  <nav class="nav">
    <a href="exec.html">임원 보고</a>
    <a href="desk.html" class="on">영업 실무</a>
  </nav>
  <div class="top-meta" id="topMeta">불러오는 중…</div>
</header>

<main class="page">
  <section class="panel bar">
    <div class="bar-head">
      <div class="bar-title">조건</div>
      <div class="bar-guide">조건을 바꾸면 즉시 반영됩니다</div>
    </div>
    <div class="grid">
      <div class="field"><label>기업명 · 차주</label><input id="q" placeholder="기업명 또는 차주 검색" /></div>
      <div class="field"><label>대출기관</label><select id="fLender"></select></div>
      <div class="field"><label>기관 유형</label><select id="fType"></select></div>
      <div class="field"><label>만기</label><select id="fMat">
        <option value="callable">만기 확보분</option>
        <option value="7">7일 이내</option>
        <option value="30">30일 이내</option>
        <option value="90">90일 이내</option>
        <option value="unknown">만기 미상</option>
        <option value="all">전체</option>
      </select></div>
      <div class="field"><label>대출금액</label><select id="fAmt">
        <option value="">전체</option><option value="10">10억 이상</option>
        <option value="100">100억 이상</option><option value="500">500억 이상</option>
      </select></div>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <div>
        <div class="h-title">담보대출 <span id="cnt">0</span>건<span id="covBadge"></span></div>
        <div class="h-sub" id="sub"></div>
      </div>
      <div class="h-act">
        <div class="tabs" id="tabs"></div>
        <button class="btn btn-dark" id="csv">CSV</button>
      </div>
    </div>
    <div class="wrap">
      <table>
        <thead><tr>
          <th>기업</th><th>차주</th><th>관계</th><th>대출기관</th>
          <th class="num">대출금액</th><th class="num">담보주식</th><th class="num">지분율</th>
          <th>계약일</th><th>만기</th><th class="num">D-day</th><th>공시</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>

  <div class="foot" id="foot"></div>
</main>

<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>

<script>
const el = id => document.getElementById(id);
const eok = v => {
  if (v == null) return null;
  const a = v / 1e8;
  if (a >= 10000) { const j = a / 10000; return (Number.isInteger(j) ? j.toFixed(0) : j.toFixed(1)) + "조원"; }
  if (a < 1) return Math.round(v / 1e4).toLocaleString("ko-KR") + "만원";
  return Math.round(a).toLocaleString("ko-KR") + "억원";
};
const fd = s => s ? s.replaceAll("-", ".") : "";
const NA = '<span class="na">미상</span>';
let D = null, rows = [], sortKey = "maturity";

const SORTS = [["maturity", "만기 빠른 순"], ["amount", "금액 큰 순"],
               ["lender", "기관순"], ["company", "기업명순"]];

const dd = s => s ? Math.ceil((new Date(s + "T00:00:00") - new Date(D.meta.baseDate + "T00:00:00")) / 86400000) : null;

function setup() {
  el("tabs").innerHTML = SORTS.map(([k, t]) =>
    `<button class="tab ${k === sortKey ? "on" : ""}" data-k="${k}">${t}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { sortKey = b.dataset.k; setup(); apply(); });

  const ls = [...new Set(D.loans.map(x => x.lender).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
  el("fLender").innerHTML = '<option value="">전체</option>' + ls.map(x => `<option>${x}</option>`).join("");
  const ts = [...new Set(D.loans.map(x => x.lender_type).filter(Boolean))].sort();
  el("fType").innerHTML = '<option value="">전체</option>' + ts.map(x => `<option>${x}</option>`).join("");
}

function apply() {
  const q = el("q").value.trim().toLowerCase();
  const L = el("fLender").value, T = el("fType").value, M = el("fMat").value, A = el("fAmt").value;
  let d = D.loans.filter(x => {
    if (q && !(x.corp_name.toLowerCase().includes(q) || (x.borrower_name || "").toLowerCase().includes(q))) return false;
    if (L && x.lender !== L) return false;
    if (T && x.lender_type !== T) return false;
    if (A && (x.loan_amount == null || x.loan_amount / 1e8 < +A)) return false;
    if (M === "callable") return x.is_active;
    if (M === "unknown") return !x.maturity_date;
    if (M !== "all") { const k = dd(x.maturity_date); return x.is_active && k != null && k <= +M; }
    return true;
  });

  d.sort((a, b) => {
    if (sortKey === "amount") return (b.loan_amount || -1) - (a.loan_amount || -1);
    if (sortKey === "company") return a.corp_name.localeCompare(b.corp_name, "ko");
    if (sortKey === "lender") return (a.lender || "힣").localeCompare(b.lender || "힣", "ko");
    const x = dd(a.maturity_date), y = dd(b.maturity_date);
    return (x == null ? 1e9 : x < 0 ? 1e6 - x : x) - (y == null ? 1e9 : y < 0 ? 1e6 - y : y);
  });
  rows = d;
  render();
}

function render() {
  el("cnt").textContent = rows.length.toLocaleString("ko-KR");
  const co = new Set(rows.map(x => x.corp_name)).size;
  const withMat = rows.filter(x => x.maturity_date).length;
  el("covBadge").innerHTML =
    `<span class="badge ${withMat === rows.length ? "green" : "orange"}" style="margin-left:8px">${co}개사 · 만기 확보 ${withMat}건</span>`;
  el("sub").textContent = "행을 클릭하면 기업 상세가 열립니다.";

  if (!rows.length) { el("tb").innerHTML = '<tr><td colspan="11"><div class="empty">조건에 맞는 계약이 없습니다.</div></td></tr>'; return; }

  let prev = null;
  el("tb").innerHTML = rows.map((r, i) => {
    const k = dd(r.maturity_date);
    const same = r.corp_name === prev; prev = r.corp_name;
    const ddayTxt = k == null ? NA : k < 0 ? `<span class="na">${-k}일 경과</span>`
      : `<span class="dday ${k <= 30 ? "soon" : ""}">D-${k}</span>`;
    return `<tr class="${same ? "" : "grp"}" data-i="${i}">
      <td>${same ? '<span class="co-cont">〃</span>'
        : `<div class="co">${r.corp_name}</div><div class="co-sub">${r.stock_code || ""} ${r.industry ? "· " + r.industry : ""}</div>`}</td>
      <td>${r.borrower_name || NA}</td>
      <td>${r.borrower_type || NA}</td>
      <td>${r.lender || NA}</td>
      <td class="num">${r.loan_amount ? eok(r.loan_amount) : NA}</td>
      <td class="num">${r.pledged_qty ? r.pledged_qty.toLocaleString("ko-KR") + "주" : NA}</td>
      <td class="num">${r.pledged_ratio != null ? r.pledged_ratio + "%" : NA}</td>
      <td>${fd(r.contract_date) || NA}</td>
      <td>${fd(r.maturity_date) || NA}</td>
      <td class="num">${ddayTxt}</td>
      <td><a class="src" href="${r.source_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">원문</a></td>
    </tr>`;
  }).join("");
  document.querySelectorAll("#tb tr[data-i]").forEach(tr =>
    tr.onclick = () => openCo(rows[+tr.dataset.i].corp_name));
}

function openCo(name) {
  const all = D.loans.filter(x => x.corp_name === name);
  const c = all[0];
  const ev = all.filter(x => x.maturity_date)
    .sort((a, b) => a.maturity_date.localeCompare(b.maturity_date));
  const span = ev.length ? [ev[0].maturity_date, ev[ev.length - 1].maturity_date] : null;
  const pos = s => {
    if (!span || span[0] === span[1]) return 50;
    const a = new Date(span[0]), b = new Date(span[1]), x = new Date(s);
    return Math.max(0, Math.min(100, (x - a) / (b - a) * 100));
  };
  el("sheet").innerHTML = `
    <div class="sheet-head">
      <div>
        <div class="sheet-co">${c.corp_name}</div>
        <div class="sheet-meta">${c.stock_code || ""} ${c.industry ? "· " + c.industry : ""}${
          c.market_cap ? " · 시총 " + (c.market_cap >= 10000 ? (c.market_cap / 10000).toFixed(1) + "조" : Math.round(c.market_cap).toLocaleString("ko-KR") + "억") : ""}</div>
      </div>
      <button class="x" onclick="closeCo()">✕</button>
    </div>
    <div class="sheet-body">
      <div class="blk">
        <div class="blk-t">만기 타임라인 <span class="badge">${ev.length}건</span></div>
        ${ev.length ? `<div class="tl">${ev.map(r => `
          <div class="tl-row">
            <div>${fd(r.maturity_date)}</div>
            <div class="tl-bar"><i style="left:calc(${pos(r.maturity_date)}% - 4px)"></i></div>
            <div style="text-align:right;font-weight:750">${r.loan_amount ? eok(r.loan_amount) : "—"}</div>
          </div>`).join("")}</div>`
          : `<div class="tl" style="color:var(--muted);font-size:12px">만기가 확보된 계약이 없습니다. 이 기업은 대환 제안 대상이 아닙니다.</div>`}
      </div>

      <div class="blk">
        <div class="blk-t">주식담보대출 <span class="badge">${all.length}건</span></div>
        <table class="mini">
          <thead><tr><th>차주</th><th>관계</th><th>기관</th><th style="text-align:right">금액</th>
            <th style="text-align:right">담보주식</th><th style="text-align:right">지분율</th><th>만기</th><th>공시</th></tr></thead>
          <tbody>${all.map(r => `<tr>
            <td>${r.borrower_name || NA}</td><td>${r.borrower_type || NA}</td><td>${r.lender || NA}</td>
            <td style="text-align:right">${r.loan_amount ? eok(r.loan_amount) : NA}</td>
            <td style="text-align:right">${r.pledged_qty ? r.pledged_qty.toLocaleString("ko-KR") : NA}</td>
            <td style="text-align:right">${r.pledged_ratio != null ? r.pledged_ratio + "%" : NA}</td>
            <td>${fd(r.maturity_date) || NA}</td>
            <td><a class="src" href="${r.source_url}" target="_blank" rel="noopener">원문</a></td>
          </tr>`).join("")}</tbody>
        </table>
      </div>

      <div class="blk">
        <div class="blk-t">보호예수 (락업)</div>
        <div class="tl" style="color:var(--muted);font-size:12px">
          데이터 수집 예정 — ${D.lockup_status.note}
        </div>
      </div>
    </div>`;
  el("drawer").classList.add("on");
}
function closeCo() { el("drawer").classList.remove("on"); }
el("drawer").onclick = e => { if (e.target.id === "drawer") closeCo(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCo(); });

function csv() {
  const h = ["기업명", "종목코드", "업종", "차주", "관계", "대출기관", "기관유형",
             "대출금액(원)", "담보주식수", "담보지분율(%)", "계약일", "만기일", "D-day", "접수번호", "원문"];
  const b = rows.map(r => {
    const k = dd(r.maturity_date);
    return [r.corp_name, r.stock_code, r.industry, r.borrower_name, r.borrower_type,
            r.lender || "미상", r.lender_type, r.loan_amount ?? "", r.pledged_qty ?? "",
            r.pledged_ratio ?? "", r.contract_date ?? "", r.maturity_date ?? "미상",
            k == null ? "미상" : k, r.rcept_no, r.source_url];
  });
  const t = [h, ...b].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const u = URL.createObjectURL(new Blob(["﻿" + t], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = u; a.download = `담보대출_${D.meta.baseDate}.csv`; a.click();
  URL.revokeObjectURL(u);
}

async function init() {
  try {
    const res = await fetch("data/dashboard.json", { cache: "no-store" });
    if (!res.ok) throw new Error("dashboard.json " + res.status);
    D = await res.json();
  } catch (e) {
    el("topMeta").textContent = "데이터 로드 실패";
    el("tb").innerHTML = `<tr><td colspan="11"><div class="empty">데이터를 불러오지 못했습니다. (${e.message})</div></td></tr>`;
    return;
  }
  el("topMeta").innerHTML = `기준일 ${fd(D.meta.baseDate)}`;
  el("foot").textContent = `출처 ${D.meta.source} · 생성 ${D.meta.generated}`;
  setup(); apply();
  el("q").addEventListener("input", apply);
  ["fLender", "fType", "fMat", "fAmt"].forEach(id => el(id).addEventListener("change", apply));
  el("csv").onclick = csv;
}
init();
</script>
</body>
</html>
